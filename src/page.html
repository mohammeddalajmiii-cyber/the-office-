  window.applyTheme = function () {

    if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "light" ? "#E6E9ED" : "#2A2D31";
  };
  applyTheme();
  try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme) } catch (e) {}
</script>

<style>
:root{color-scheme:dark}
body{margin:0}
[hidden]{display:none!important}

/* Layout: compact top bar, bottom tab bar on phones (top on wide screens), one calm column of cards.
   Look: plain grey, deep teal buttons, and a contour map that lights up as a slow prism scan passes. Light mode is the same in light grey. */
:root{
  --bg:#2A2D31; --surface:rgba(34,37,41,.94); --solid:#24272B; --ink:#EEF1F3; --muted:#A3ABB4; --line:rgba(255,255,255,.08); --hero:rgba(36,39,44,.96);
  --accent:#7AB3B6; --fill:#0D5E63; --accent-soft:#1D4348; --on-accent:#FFFFFF; --tone:#0D5E63;
  --keep:#5BC892; --keep-soft:#14301F; --drop:#F08872; --drop-soft:#3A1C16; --warn:#F0B35A; --warn-soft:#3A2A10;
  --topbar:rgba(42,45,49,.62); --notch:rgba(42,45,49,.94); --chatbg:rgba(34,37,41,.94); --field:#222529;
  --sky:#2A2D31;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
/* light mode: cool white and grey, blue-cyan accent */
:root[data-theme="light"]{
  --bg:#E6E9ED; --surface:#FFFFFF; --solid:#F5F6F8; --ink:#11181F; --muted:#5A646F; --line:rgba(20,32,44,.12); --hero:rgba(248,250,251,.96);
  --accent:#0D5E63; --fill:#0D5E63; --accent-soft:#DCEDEE; --tone:#0D5E63; --on-accent:#FFFFFF;
  --keep:#16794C; --keep-soft:#DCF2E6; --drop:#B83A26; --drop-soft:#F8E1DC; --warn:#985A00; --warn-soft:#FBEBD2;
  --topbar:rgba(230,233,237,.85); --notch:rgba(230,233,237,.95); --chatbg:rgba(255,255,255,.9); --field:#F3F5F7;
  --sky:#E6E9ED;
  color-scheme:light;
}

body{background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--notch)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:600}
.lede{color:var(--muted);margin:6px 0 0;max-width:60ch}
.label{font:500 12.5px/1.3 var(--body);color:var(--muted)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 10px;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;font:800 21px/1 var(--display);letter-spacing:-.02em;color:var(--ink)}
.mark{width:30px;height:30px;flex:none}
.mark-lg{width:84px;height:84px;margin-bottom:4px}
.brand-accent{color:var(--accent)}
.brand-txt{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.brand-sub{white-space:nowrap;text-align:left;font:600 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:420px){.brand-sub{font-size:8.5px;letter-spacing:.05em}}
.gate-sub{margin:-6px 0 4px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* logo: grey outer arch, white-to-teal inner arch, white star (light mode: teal) */
#brandg stop:first-child{stop-color:#F2F7F8}
#brandg stop:last-child{stop-color:#3E8A8F}
.mark path:first-child{stroke:#4A5059}
:root[data-theme="light"] #brandg stop:first-child{stop-color:#7AB3B6}
:root[data-theme="light"] #brandg stop:last-child{stop-color:#0D5E63}
:root[data-theme="light"] .mark path:first-child{stroke:#5A646F}
:root[data-theme="light"] .mark path:last-child{fill:#0D5E63}
:root[data-theme="light"] .idea,:root[data-theme="light"] .compose{box-shadow:0 1px 2px rgba(16,42,72,.05),0 4px 14px rgba(16,42,72,.04)}
.me-btn{border:0;background:none;padding:0;border-radius:50%}
.me-btn .av{width:34px;height:34px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.status{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.warn{color:var(--drop)}

/* main navigation: bottom bar on phones, a row under the top bar on wide screens */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--solid);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab{position:relative;background:none;border:0;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] .ico{background:var(--accent-soft)}
.ico{display:grid;place-items:center;width:48px;height:28px;border-radius:999px;transition:background .15s}
.count{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;box-sizing:border-box;padding:0 5px;border-radius:999px;background:var(--drop);color:#fff;font:600 11px/18px var(--body);text-align:center}
#c-ideas,#c-projects{background:var(--muted)}
@media (min-width:760px){
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);bottom:auto;z-index:14;display:flex;gap:4px;border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:18px}
  .tab{flex-direction:row;gap:8px;font-size:14px;padding:6px 14px 6px 6px}
  .ico{width:34px}
  .count{position:static;margin-left:2px}
  .wrap{padding-bottom:64px}
}

/* partners: the team's Partners tab and the partners' own small site */
.nav.pnav{grid-template-columns:repeat(4,1fr)}
.pgroup{text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pstat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;color:var(--muted);min-width:0}
.pstat b{display:block;font:800 22px/1.15 var(--display);color:var(--ink)}
.st{font:600 11.5px/1 var(--body);padding:5px 9px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap;flex:none}
.st.noanswer,.st.callback{background:var(--accent-soft);color:var(--accent)}
.st.interested,.st.meeting{background:var(--warn-soft);color:var(--warn)}
.st.won{background:var(--keep-soft);color:var(--keep)}
.st.lost{background:var(--drop-soft);color:var(--drop)}
.lead{gap:10px}
.lead .x{border:0;background:none;color:var(--muted);padding:0 4px}
.lphone{font:600 17px/1.2 var(--body);color:var(--ink);text-decoration:none;letter-spacing:.01em;overflow-wrap:anywhere}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.lead-edit{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start}
.lead-edit .mini{padding:8px 6px;font-size:13px}
@media (max-width:520px){.lead-edit{grid-template-columns:1fr auto}.lead-edit textarea{grid-column:1/-1;grid-row:2}}
.lead-hist summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.lead-hist ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;font-size:13px}
.lead-hist li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.pfeed{display:grid;gap:8px}
.post{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.post.team{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.post.call{background:transparent;padding:8px 12px}
.post .av{width:30px;height:30px}
.post .x{border:0;background:none;color:var(--muted);padding:0 4px;margin-left:auto}
.post-body{flex:1;min-width:0;display:grid;gap:4px}
.post-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.post-meta b{color:var(--ink)}
.post-text{white-space:pre-wrap;overflow-wrap:anywhere}
.call-dot{width:30px;text-align:center;flex:none;color:var(--muted)}
.feedlink{display:grid;gap:4px;justify-items:start;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;width:100%}
.feedlink .post{width:100%;box-sizing:border-box}
.pimport{display:grid;gap:4px;font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px}
.plinks{margin:0;padding-left:18px;display:grid;gap:6px}
.plinks li a{color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.plinks .x{border:0;background:none;color:var(--muted);margin-left:6px}
.filelink{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:2px 0;color:var(--accent);font:600 15px var(--body);cursor:pointer;text-align:left}
.filelink .att-ext{flex:none}
.plink{font-size:13px;overflow-wrap:anywhere;color:var(--ink)}
.rulesbox{width:100%;box-sizing:border-box;min-height:200px;font:11.5px/1.45 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);resize:vertical}
.p-group{font-size:13px;color:var(--muted);font-weight:600}


/* clients and per-project partners: the project status card */
.cstatus{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
.cstatus h2{font:800 24px/1.15 var(--display);margin:0}
.cstatus.big h2{font-size:clamp(26px,5vw,34px)}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;counter-reset:s}
.stages li{display:grid;justify-items:center;gap:6px;text-align:center;position:relative;font-size:12.5px;color:var(--muted);min-width:0}
.stages li::before{content:"";position:absolute;top:14px;left:-50%;right:50%;height:2px;background:var(--line);z-index:0}
.stages li:first-child::before{display:none}
.stages li.done::before,.stages li.now::before{background:var(--fill)}
.stages .dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--body);background:var(--field);border:2px solid var(--line);color:var(--muted)}
.stages li.done .dot{background:var(--fill);border-color:var(--fill);color:#fff}
.stages li.now .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stages li.now .sname{color:var(--ink);font-weight:700}
.sname{overflow-wrap:anywhere}
.cprog{display:flex;align-items:center;gap:10px;font:700 14px var(--body)}
.cprog .track{flex:1;height:10px}
.cnow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.cnow>div{background:var(--field);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.cnow b{font-size:15px}
.cdate{font-size:13px;color:var(--accent);font-weight:600}
.c-hello{font:800 clamp(28px,6vw,40px)/1.1 var(--display);margin:6px 0 0}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.plist li{padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}

.catchips{display:inline-flex;gap:4px;flex-wrap:wrap}
.catchip-x{display:inline-flex;align-items:center;gap:4px}
.catchip-x button{border:0;background:none;color:inherit;opacity:.65;padding:0 2px;cursor:pointer;font-size:11px}
.catchip-x button:hover{opacity:1}
.waitchip{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readychip{font-size:12px;font-weight:600;color:var(--keep);background:var(--keep-soft);padding:3px 8px;border-radius:999px}
.planner.waitdone{opacity:.7}
/* compose */
.compose{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.compose input,.compose textarea,.addstep input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.compose textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 15px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--on-accent)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.list{display:grid;gap:12px;margin-top:18px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.idea p{margin:0;color:var(--muted);overflow-wrap:anywhere}
.by{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.av{width:24px;height:24px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--surface)}
.stack{display:flex}.stack .av{margin-left:-7px}.stack .av:first-child{margin-left:0}

.vote{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.v{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 10px;font-weight:600;font-size:14px}
.v b{font:500 13px/1 var(--body)}
.v.keep[aria-pressed="true"]{background:var(--keep-soft);border-color:var(--keep);color:var(--keep)}
.v.drop[aria-pressed="true"]{background:var(--drop-soft);border-color:var(--drop);color:var(--drop)}
.verdict{font-size:13px;font-weight:600}
.verdict.keep{color:var(--keep)}.verdict.drop{color:var(--drop)}

details.removed{margin-top:22px;color:var(--muted)}
details.removed summary{cursor:pointer;font-weight:600}
details.removed .idea{opacity:.75}

.empty{border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted);background:color-mix(in srgb,var(--surface) 50%,transparent)}

/* progress line */
.track{position:relative;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--fill);border-radius:999px;transition:width .4s ease}
.track .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.pmeta{display:flex;justify-content:space-between;font:500 12px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}

/* focus */
.focus{background:var(--hero);color:var(--ink);border-radius:18px;padding:22px;display:grid;gap:12px;margin-bottom:18px}
.focus .label{color:inherit;opacity:.7}
.focus h2{font-size:clamp(24px,5vw,32px)}
.focus .track{height:12px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.focus .track .tick{background:var(--hero)}
.focus .pmeta{color:inherit;opacity:.8}
.focus .btn:not(.quiet){color:var(--ink)}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;min-width:0}
.steps input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.steps label{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.steps li.done label{color:var(--muted);text-decoration:line-through}
.steps .x{opacity:0;border:0;background:none;color:var(--muted);padding:0 4px}
.steps li:hover .x,.steps .x:focus-visible{opacity:1}
.addstep{display:flex;gap:8px}
.addstep input{flex:1;min-width:0}
.members{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));align-items:start}
.member.me{border-color:var(--accent)}
.empty h3{color:var(--ink)}
.gate{max-width:420px;margin:12vh auto 0;display:grid;gap:14px;text-align:center;justify-items:center}
.gate p{color:var(--muted);margin:0}
.me-chip{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.tabs{overflow-x:auto;scrollbar-width:none}
.tab{white-space:nowrap}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:0;margin-bottom:12px}
.chip{font:500 11px/1 var(--body);letter-spacing:.04em;padding:5px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.mini{font:500 12px/1.2 var(--body);color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;max-width:100%;min-width:0}
.phase{display:grid;gap:4px;margin-top:6px}
.phase-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.phase-h h3{font-size:17px}
.phase-n{font:500 12px/1 var(--body);color:var(--muted)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.task input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.task .ttext{overflow-wrap:anywhere;cursor:pointer}
.task.done .ttext{color:var(--muted);text-decoration:line-through}
.task .meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.task .x{border:0;background:none;color:var(--muted);padding:0 4px}
.addtask{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.addtask input{flex:1 1 180px;min-width:0;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px}
.phasebar{display:flex;gap:6px;flex-wrap:wrap}
.ph{font:500 11px/1 var(--body);padding:5px 8px;border-radius:6px;border:1px solid var(--line)}

.focus .ph{border-color:color-mix(in srgb,var(--accent) 25%,transparent)}

.sg-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:14px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.sg-row .why{grid-column:1/3;font-size:12px;color:var(--muted)}
.sg-who{display:flex;gap:6px;align-items:center;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:13px 14px;font-weight:500}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qprog{display:flex;justify-content:space-between;font:500 12px/1 var(--body);color:var(--muted)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:92px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:8px}
.bar .pct{font:500 12px/1 var(--body);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar.top{font-weight:600}
.role{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1}
.catbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.catbar:empty{display:none}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:var(--on-accent)}
.catchip{font:500 11px/1 var(--body);padding:5px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.notes{grid-column:2/4;display:grid;gap:6px;justify-items:start}
.note{display:flex;gap:8px;align-items:flex-start;font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box}
.note-body{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.note-meta{font-size:12px;color:var(--muted)}
.noteedit{display:grid;gap:6px;width:100%}
.noteinput,#chat-input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;resize:vertical;font:inherit;color:inherit}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.steps .notes .x,.note .x{opacity:1}
/* In each person's list, notes sit under the task instead of beside it */
.steps .notes{grid-column:auto;width:100%}
.steps li{padding:8px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps label{line-height:1.45}
.chatbox{display:grid;gap:8px}
.chatlog{height:clamp(280px,calc(100dvh - 370px),620px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;font:500 11px/1 var(--body);color:var(--muted);margin:12px 0 6px}
.msg-name{font-size:12px;color:var(--muted);margin:8px 0 2px 32px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:85%}
.msg.mine{align-self:flex-end}
.msg .av{margin:0}
.av-space{width:22px;flex:none}
.bubble{background:var(--line);border-radius:14px;padding:7px 11px;overflow-wrap:anywhere;white-space:pre-wrap;min-width:0}
.msg.mine .bubble{background:var(--fill);color:var(--on-accent)}
.msg-time{font:500 10px/1 var(--body);opacity:.6;margin-left:8px;white-space:nowrap}
.bubble{cursor:pointer;display:grid;gap:4px}
.bubble>span:not(.msg-time){display:inline}
.msg.selected .bubble{outline:2px solid var(--accent);outline-offset:2px}
.msg.flash .bubble{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:none}}
.quote{display:grid;gap:1px;text-align:left;border:0;border-left:3px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 8px;font-size:13px;max-width:100%;overflow-wrap:anywhere;white-space:normal;cursor:pointer}
.quote span{color:var(--muted)}
.msg.mine .quote{background:color-mix(in srgb,var(--on-accent) 14%,transparent);border-left-color:var(--on-accent);color:var(--on-accent)}
.msg.mine .quote span{color:inherit;opacity:.85}
.msg-actions{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px 30px}
.msg-actions.mine{justify-content:flex-end;margin-left:0}
.act{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.act.danger{color:var(--drop);border-color:var(--drop)}
.act.quiet{color:var(--muted)}
.chat-context{display:flex;gap:10px;align-items:center;border-left:3px solid var(--accent);background:var(--surface);border-radius:8px;padding:8px 10px}
.ctx-title{font-size:12px;font-weight:600;color:var(--accent)}
.ctx-text{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-context .x{border:0;background:none;color:var(--muted);font-size:16px;padding:4px}
@media (prefers-reduced-motion:reduce){.msg.flash .bubble{animation:none}}
.chatform{display:flex;gap:8px;align-items:flex-end}
#chat-input{resize:none;max-height:140px}
.attach{flex:none;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--muted)}
.attach:hover{color:var(--accent);border-color:var(--accent)}
.attach-list{display:flex;gap:8px;flex-wrap:wrap}

.att-chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.att-chip .x{border:0;background:none;color:var(--muted)}
.upload-status{font-size:13px;color:var(--accent);font-weight:600}
.chatbox.dropping .chatlog{outline:2px dashed var(--accent);outline-offset:-6px}
.att-img{border:0;padding:0;background:none;border-radius:10px;overflow:hidden;display:block;max-width:min(260px,100%);cursor:zoom-in}
.att-img img{display:block;width:100%;height:auto;max-height:320px;object-fit:cover}
.att-file{display:flex;gap:10px;align-items:center;background:var(--surface);color:var(--ink);border-radius:10px;padding:8px;min-width:0;max-width:280px}
.att-ext{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 10px/1 var(--body)}
.att-info{flex:1;min-width:0}
.att-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-size{font:500 11px/1.4 var(--body);color:var(--muted)}
.att-file .act{flex:none}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,14,18,.86);display:grid;grid-template-rows:auto 1fr;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:10px}
.lb-bar{display:flex;gap:8px;align-items:center;color:#fff}

.addphase{border-style:dashed}
.planner{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 8px 3px 3px;color:var(--ink)}

.prio{font:500 11px/1 var(--body);padding:5px 8px;border-radius:6px;white-space:nowrap;border:1px solid currentColor}
.prio-urgent{color:var(--drop);background:var(--drop-soft)}
.prio-high{color:var(--warn);background:var(--warn-soft)}
.prio-medium{color:var(--accent);background:var(--accent-soft)}
.prio-low{color:var(--muted);background:transparent}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}

.due{font:500 11px/1 var(--body);color:var(--muted)}
.due.late{color:var(--drop)}
.due.soon{color:var(--warn)}
.notegrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));align-items:start}
.pnote{min-height:140px;background:var(--surface);border-color:transparent;padding:4px 2px;font-size:15px;line-height:1.5}
.pnote:focus{outline:none}
.profile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--hero);border-radius:20px;padding:20px}

.newscard{margin-top:12px;border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 8%,var(--surface)),var(--surface));border-radius:16px;padding:14px 16px;display:grid;gap:6px}

.news-ico{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);font-size:14px}
.newslist{display:grid;gap:4px;margin-top:6px}
.newsrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}

.nowcard{display:grid;gap:2px;width:100%;text-align:left;margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;color:var(--ink)}

.now-sub{font-size:13.5px;color:var(--accent);font-weight:600}
.notice{margin-top:12px;border-radius:14px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500}
.seg-wide{display:flex;width:100%;box-sizing:border-box}
.seg-wide button{flex:1;padding:9px 12px;font-size:14px}
.me-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.me-email{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative;border:0;background:none;color:var(--ink);width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.bell:hover{background:var(--surface)}
.bell .count{top:2px;left:auto;right:0}
.alerts{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 58px);right:max(12px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 24px));max-height:min(70vh,560px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(15,20,35,.18);padding:10px;box-sizing:border-box;display:grid;gap:2px;align-content:start}
.alerts .x{border:0;background:none;color:var(--muted);font-size:16px;padding:4px 6px}
.alert{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:0;background:none;border-radius:12px;padding:10px;color:var(--ink);font-size:14px}
.alert:hover{background:var(--bg)}
.alert.new{background:var(--accent-soft)}
.alert .av{width:30px;height:30px}
.alert-dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);font-weight:800}

.alert-time{font-size:12px;color:var(--muted)}
.alert-tip{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:6px}
.alert-empty{color:var(--muted);font-size:14px;padding:6px 10px 10px;margin:0}
.buildcard{text-align:left;width:100%;color:var(--ink);font:inherit;cursor:pointer}
.buildcard:hover{border-color:var(--accent)}
.done-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--keep);background:var(--keep-soft);border-radius:999px;padding:4px 10px}
.done-card h3{font-size:19px}
.confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
.task .ttext{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.chev{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px;min-width:24px}

.tlabel{font-size:12.5px;font-weight:600;color:var(--muted);padding-top:5px}
.tval{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.tval .notes{grid-column:auto;width:100%}
.seg-sm button{padding:5px 10px;font-size:12.5px}
.seg button:disabled{opacity:.6;cursor:not-allowed}
.checklist{display:grid;gap:4px;width:100%}
.ck{display:flex;gap:8px;align-items:center;font-size:14px}

.ck label{flex:1;min-width:0;overflow-wrap:anywhere}
.ck.done label{color:var(--muted);text-decoration:line-through}
.ck .x{border:0;background:none;color:var(--muted)}

.goal-text{font:700 18px/1.35 var(--display);color:var(--ink)!important}

.checkin-form{gap:8px}
.checkin{gap:8px}

.btn.small{padding:6px 11px;font-size:13px}

.projcard{gap:10px}

.projcard:hover{border-color:var(--accent)}
.rank{font-size:13px;font-weight:700;color:var(--muted)}

.addlink{color:var(--muted);border-style:dashed;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}

      <input id="f-title" maxlength="80" placeholder="Name it — e.g. Shared expense tracker for trips" required>
      <select id="f-cat" class="mini" style="padding:9px 10px;font-size:14px" aria-label="Category" required><option value="">Pick a category…</option></select>
      <input id="f-newcat" maxlength="30" placeholder="Type the new category name" hidden>
      <input id="f-client" maxlength="80" placeholder="Client, brand or company (optional)" autocomplete="off">
      <textarea id="f-pitch" maxlength="600" placeholder="What is it, who's it for, why would it be fun to build?"></textarea>
      <div class="row"><button type="button" class="btn quiet" id="f-help">✦ Help me think</button><span class="spacer"></span><button class="btn primary" id="f-submit">Add to the vote</button></div>
    </form>
    <div class="catbar" id="cat-ideas"></div>
    <div class="list" id="ideas"></div>
    <div id="removed"></div>
  </section>

  <section id="view-projects" hidden>
    <div class="catbar" id="cat-projects"></div>
    <div class="list" id="projects"></div>
  </section>


  <section id="view-partners" hidden><div id="partners"></div></section>

  <section id="view-skills" hidden><div id="skills"></div></section>

  <section id="view-settings" hidden><div id="settings"></div></section>

  <section id="view-money" hidden><div id="money"></div></section>

  <section id="view-chat" hidden>
    <div class="chatbox">
      <div class="chat-head" id="chat-head"></div>
      <div class="chatlog" id="chatlog" aria-live="polite"></div>
      <div class="chat-context" id="chat-context" hidden></div>
      <div class="attach-list" id="attach-list" hidden></div>
      <div class="upload-status" id="upload-status" hidden></div>
      <form class="chatform" id="chatform">
        <button type="button" class="attach" id="chat-attach" aria-label="Attach files" title="Attach photos or files"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg></button>
        <input type="file" id="chat-file" multiple hidden>
        <textarea id="chat-input" rows="1" maxlength="1000" placeholder="Message the team" aria-label="Message"></textarea>
        <button class="btn primary" id="chat-send">Send</button>
      </form>
    </div>
  </section>
</div>
<div class="wrap" id="partner" hidden>
  <header class="topbar">
    <span class="brand"><span>Ardent <span class="brand-accent">Studios</span></span></span>
    <span class="spacer"></span>
    <span class="p-group" id="p-group"></span>
  </header>
  <nav class="nav pnav" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-pview="leads"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>Numbers <span class="count" id="pc-leads" hidden>0</span></button>
    <button class="tab" role="tab" data-pview="updates"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg></span>Updates <span class="count" id="pc-updates" hidden>0</span></button>
    <button class="tab" role="tab" data-pview="projects"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Projects <span class="count" id="pc-projects" hidden>0</span></button>
    <button class="tab" role="tab" data-pview="info"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></span>Info</button>
  </nav>
  <section id="pv"></section>
</div>
<div class="wrap" id="client" hidden>
  <header class="topbar">
    <span class="brand"><span>Ardent <span class="brand-accent">Studios</span></span></span>
    <span class="spacer"></span>
  </header>
  <main id="cv" style="padding-bottom:40px"></main>
</div>
