<script>
  // Dark (galaxy), light, or match the device. Chosen in Settings and kept on this device.
  window.applyTheme = function () {
    try {   // a link like ?look=pine switches this device to that look (and keeps it, even if the account says otherwise)
      var q = new URLSearchParams(location.search).get("look");
      if (/^(dark|light|pine|system)$/.test(q || "")) { localStorage.setItem("theme", q); sessionStorage.setItem("lookFromLink", "1"); history.replaceState(null, "", location.pathname + location.hash) }
    } catch (e) {}
    var t = "dark"; try { t = localStorage.getItem("theme") || "dark" } catch (e) {}
    if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "light" ? "#E6E9ED" : t === "pine" ? "#0E4A44" : "#2A2D31";
  };
  applyTheme();
  try { matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme) } catch (e) {}
</script>

<style>
:root{color-scheme:dark}
body{margin:0}
[hidden]{display:none!important}

/* Layout: compact top bar, bottom tab bar on phones (top on wide screens), one calm column of cards.
   Look: plain grey, deep teal buttons, and a contour map that lights up as a slow prism scan passes. Light mode is the same in light grey. */
:root{
  --bg:#2A2D31; --surface:rgba(34,37,41,.94); --solid:#24272B; --ink:#EEF1F3; --muted:#A3ABB4; --line:rgba(255,255,255,.08); --hero:rgba(36,39,44,.96);
  --accent:#7AB3B6; --fill:#0D5E63; --accent-soft:#1D4348; --on-accent:#FFFFFF; --tone:#0D5E63;
  --keep:#5BC892; --keep-soft:#14301F; --drop:#F08872; --drop-soft:#3A1C16; --warn:#F0B35A; --warn-soft:#3A2A10;
  --topbar:rgba(42,45,49,.62); --notch:rgba(42,45,49,.94); --chatbg:rgba(34,37,41,.94); --field:#222529;
  --sky:#2A2D31;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
/* light mode: cool white and grey, blue-cyan accent */
:root[data-theme="light"]{
  --bg:#E6E9ED; --surface:#FFFFFF; --solid:#F5F6F8; --ink:#11181F; --muted:#5A646F; --line:rgba(20,32,44,.12); --hero:rgba(248,250,251,.96);
  --accent:#0D5E63; --fill:#0D5E63; --accent-soft:#DCEDEE; --tone:#0D5E63; --on-accent:#FFFFFF;
  --keep:#16794C; --keep-soft:#DCF2E6; --drop:#B83A26; --drop-soft:#F8E1DC; --warn:#985A00; --warn-soft:#FBEBD2;
  --topbar:rgba(230,233,237,.85); --notch:rgba(230,233,237,.95); --chatbg:rgba(255,255,255,.9); --field:#F3F5F7;
  --sky:#E6E9ED;
  color-scheme:light;
}

:root[data-theme="pine"]{
  --bg:#0E4A44; --surface:rgba(9,54,49,.92); --solid:#0B3D38; --ink:#F2F6F5; --muted:#B4C9C5; --line:rgba(255,255,255,.12); --hero:rgba(10,60,55,.96);
  --accent:#A8D8D0; --fill:#454B53; --accent-soft:#185D55; --on-accent:#FFFFFF; --tone:#A8D8D0;
  --keep:#6FD6A3; --keep-soft:#123F2E; --drop:#F59A86; --drop-soft:#4A2620; --warn:#F3BE6A; --warn-soft:#46361A;
  --topbar:rgba(14,74,68,.66); --notch:rgba(14,74,68,.95); --chatbg:rgba(9,54,49,.92); --field:#0A3934;
  --sky:#0E4A44;
  color-scheme:dark;
}

body{background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--notch)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:600}
.lede{color:var(--muted);margin:6px 0 0;max-width:60ch}
.label{font:500 12.5px/1.3 var(--body);color:var(--muted)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 10px;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;font:800 21px/1 var(--display);letter-spacing:-.02em;color:var(--ink)}
.mark{width:19px;height:32px;flex:none}
.mark-lg{width:52px;height:86px;margin-bottom:6px}
.brand-accent{color:var(--accent)}
.pill.pill-paused,.focus .pill.pill-paused{background:color-mix(in srgb,#E8B83A 18%,transparent);color:#E8B83A;border-color:color-mix(in srgb,#E8B83A 45%,transparent)}
.paused-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#E8B83A 12%,transparent);border:1px solid color-mix(in srgb,#E8B83A 35%,transparent);font-size:14px}
.onelead{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.onelead{grid-template-columns:1fr}}
.nicklist{display:grid;gap:8px}
.nickrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.2fr) auto;gap:10px;align-items:center}
.nickname-real{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
@media (max-width:520px){.nickrow{grid-template-columns:auto minmax(0,1fr) auto}.nickrow input{grid-column:1/3}}
.brand-txt{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.brand-sub{white-space:nowrap;text-align:left;font:600 10.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:420px){.brand-sub{font-size:8.5px;letter-spacing:.05em}}
.gate-sub{margin:-6px 0 4px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* logo: the Ardent Studios torch (flame, brighter inner flame, handle) */
.mark .t-f{fill:#5FB3A8}.mark .t-i{fill:#A8D8D0}.mark .t-h{fill:#F2F4F5}
:root[data-theme="light"] .mark .t-f{fill:#0F5E57}
:root[data-theme="light"] .mark .t-i{fill:#3E9C8F}
:root[data-theme="light"] .mark .t-h{fill:#2B2E33}
:root[data-theme="pine"] .mark .t-f{fill:#A8D8D0}
:root[data-theme="pine"] .mark .t-i,:root[data-theme="pine"] .mark .t-h{fill:#FFFFFF}
:root[data-theme="light"] .idea,:root[data-theme="light"] .compose{box-shadow:0 1px 2px rgba(16,42,72,.05),0 4px 14px rgba(16,42,72,.04)}
.me-btn{border:0;background:none;padding:0;border-radius:50%}
.me-btn .av{width:34px;height:34px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.status{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.warn{color:var(--drop)}

/* main navigation: bottom bar on phones, a row under the top bar on wide screens */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--solid);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab{position:relative;background:none;border:0;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] .ico{background:var(--accent-soft)}
.ico{display:grid;place-items:center;width:48px;height:28px;border-radius:999px;transition:background .15s}
.count{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;box-sizing:border-box;padding:0 5px;border-radius:999px;background:var(--drop);color:#fff;font:600 11px/18px var(--body);text-align:center}
#c-ideas,#c-projects{background:var(--muted)}
@media (min-width:760px){
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);bottom:auto;z-index:14;display:flex;gap:4px;border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:18px}
  .tab{flex-direction:row;gap:8px;font-size:14px;padding:6px 14px 6px 6px}
  .ico{width:34px}
  .count{position:static;margin-left:2px}
  .wrap{padding-bottom:64px}
}

/* partners: the team's Partners tab and the partners' own small site */
.nav.pnav{grid-template-columns:repeat(4,1fr)}
.pgroup{text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pstat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;color:var(--muted);min-width:0}
.pstat b{display:block;font:800 22px/1.15 var(--display);color:var(--ink)}
.st{font:600 11.5px/1 var(--body);padding:5px 9px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap;flex:none}
.st.noanswer,.st.callback{background:var(--accent-soft);color:var(--accent)}
.st.interested,.st.meeting{background:var(--warn-soft);color:var(--warn)}
.st.won{background:var(--keep-soft);color:var(--keep)}
.st.lost{background:var(--drop-soft);color:var(--drop)}
.lead{gap:10px}
.lead .x{border:0;background:none;color:var(--muted);padding:0 4px}
.lphone{font:600 17px/1.2 var(--body);color:var(--ink);text-decoration:none;letter-spacing:.01em;overflow-wrap:anywhere}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.lead-edit{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start}
.lead-edit .mini{padding:8px 6px;font-size:13px}
@media (max-width:520px){.lead-edit{grid-template-columns:1fr auto}.lead-edit textarea{grid-column:1/-1;grid-row:2}}
.lead-hist summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.lead-hist ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;font-size:13px}
.lead-hist li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.pfeed{display:grid;gap:8px}
.post{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.post.team{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.post.call{background:transparent;padding:8px 12px}
.post .av{width:30px;height:30px}
.post .x{border:0;background:none;color:var(--muted);padding:0 4px;margin-left:auto}
.post-body{flex:1;min-width:0;display:grid;gap:4px}
.post-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.post-meta b{color:var(--ink)}
.post-text{white-space:pre-wrap;overflow-wrap:anywhere}
.call-dot{width:30px;text-align:center;flex:none;color:var(--muted)}
.feedlink{display:grid;gap:4px;justify-items:start;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;width:100%}
.feedlink .post{width:100%;box-sizing:border-box}
.pimport{display:grid;gap:4px;font-size:13px;background:var(--bg);border-radius:10px;padding:10px 12px}
.prepeat{border-left:3px solid #d9a441}
.msg-leads{display:block;margin-top:8px;border:0;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:rgba(127,127,127,.18);color:inherit}
.msg-leads:hover{background:rgba(127,127,127,.3)}
.leadpick{position:fixed;inset:0;z-index:45;background:rgba(10,14,18,.6);display:grid;place-items:center;padding:16px}
.leadpick-card{background:var(--solid);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(580px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:16px;display:grid;gap:12px;box-sizing:border-box;box-shadow:0 16px 50px rgba(0,0,0,.35)}
.lp-list{display:grid}
.lp-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.lp-row.off b{opacity:.55}
.lp-why{color:#d9a441;font-size:13px;font-weight:600}
.plinks{margin:0;padding-left:18px;display:grid;gap:6px}
.plinks li a{color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.plinks .x{border:0;background:none;color:var(--muted);margin-left:6px}
.filelink{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:2px 0;color:var(--accent);font:600 15px var(--body);cursor:pointer;text-align:left}
.filelink .att-ext{flex:none}
.plink{font-size:13px;overflow-wrap:anywhere;color:var(--ink)}
.rulesbox{width:100%;box-sizing:border-box;min-height:200px;font:11.5px/1.45 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);resize:vertical}
.p-group{font-size:13px;color:var(--muted);font-weight:600}


/* clients and per-project partners: the project status card */
.cstatus{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
.cstatus h2{font:800 24px/1.15 var(--display);margin:0}
.cstatus.big h2{font-size:clamp(26px,5vw,34px)}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;counter-reset:s}
.stages li{display:grid;justify-items:center;gap:6px;text-align:center;position:relative;font-size:12.5px;color:var(--muted);min-width:0}
.stages li::before{content:"";position:absolute;top:14px;left:-50%;right:50%;height:2px;background:var(--line);z-index:0}
.stages li:first-child::before{display:none}
.stages li.done::before,.stages li.now::before{background:var(--fill)}
.stages .dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--body);background:var(--field);border:2px solid var(--line);color:var(--muted)}
.stages li.done .dot{background:var(--fill);border-color:var(--fill);color:#fff}
.stages li.now .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.stages li.now .sname{color:var(--ink);font-weight:700}
.sname{overflow-wrap:anywhere}
.cprog{display:flex;align-items:center;gap:10px;font:700 14px var(--body)}
.cprog .track{flex:1;height:10px}
.cnow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.cnow>div{background:var(--field);border-radius:12px;padding:10px 12px;display:grid;gap:3px}
.cnow b{font-size:15px}
.cdate{font-size:13px;color:var(--accent);font-weight:600}
.c-hello{font:800 clamp(28px,6vw,40px)/1.1 var(--display);margin:6px 0 0}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.plist li{padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}

.catchips{display:inline-flex;gap:4px;flex-wrap:wrap}
.catchip-x{display:inline-flex;align-items:center;gap:4px}
.catchip-x button{border:0;background:none;color:inherit;opacity:.65;padding:0 2px;cursor:pointer;font-size:11px}
.catchip-x button:hover{opacity:1}
.waitchip{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readychip{font-size:12px;font-weight:600;color:var(--keep);background:var(--keep-soft);padding:3px 8px;border-radius:999px}
.planner.waitdone{opacity:.7}
/* compose */
.compose{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.compose input,.compose textarea,.addstep input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.compose textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 15px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--on-accent)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.list{display:grid;gap:12px;margin-top:18px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.idea p{margin:0;color:var(--muted);overflow-wrap:anywhere}
.by{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.av{width:24px;height:24px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--surface)}
.stack{display:flex}.stack .av{margin-left:-7px}.stack .av:first-child{margin-left:0}

.vote{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.v{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 10px;font-weight:600;font-size:14px}
.v b{font:500 13px/1 var(--body)}
.v.keep[aria-pressed="true"]{background:var(--keep-soft);border-color:var(--keep);color:var(--keep)}
.v.drop[aria-pressed="true"]{background:var(--drop-soft);border-color:var(--drop);color:var(--drop)}
.verdict{font-size:13px;font-weight:600}
.verdict.keep{color:var(--keep)}.verdict.drop{color:var(--drop)}

details.removed{margin-top:22px;color:var(--muted)}
details.removed summary{cursor:pointer;font-weight:600}
details.removed .idea{opacity:.75}

.empty{border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted);background:color-mix(in srgb,var(--surface) 50%,transparent)}

/* progress line */
.track{position:relative;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--fill);border-radius:999px;transition:width .4s ease}
.track .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}

/* ===== One calm look on every screen =====
   One card shape, softer shadows, round header buttons, a filled pill for the tab you're on,
   joined numbers on Me, softer priority colours, and the Add button only while you type a task. */
:root{--r:18px;--r-sm:14px;--lift:inset 0 1px 0 rgba(255,255,255,.045),0 1px 2px rgba(0,0,0,.14)}
:root[data-theme="light"]{--lift:0 1px 2px rgba(16,42,72,.06),0 6px 18px rgba(16,42,72,.05)}
.idea,.compose,.cstatus,.newscard,.nowcard,.focus,.profile,.empty{border-radius:var(--r)}
.idea,.compose,.nowcard,.newscard,.focus,.profile,.cstatus{box-shadow:var(--lift)}
.btn{border-radius:11px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--fill) 86%,#fff),var(--fill));box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 6px 16px color-mix(in srgb,var(--fill) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.compose input,.compose textarea,.addtask input,.noteinput,#chat-input{border-radius:11px}
.seg{border-radius:14px;padding:4px}
.seg button{border-radius:10px}
.topbar .bell{width:38px;height:38px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s}
.topbar .bell:hover{border-color:var(--accent);background:var(--surface)}
.topbar .bell svg{width:19px;height:19px}
.asst-btn span{font-size:17px}
.topbar .bell .count{position:absolute;margin:0;top:-3px;right:-3px;min-width:17px;height:17px;line-height:17px;font-size:10px;padding:0 4px;box-shadow:0 0 0 2px var(--bg)}
.me-btn .av{width:36px;height:36px;border-width:0;box-shadow:0 0 0 1px var(--line),0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.tab .ico{transition:background .2s,color .2s,transform .2s}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .ico{background:var(--fill);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--fill) 40%,transparent)}
.profile{border:1px solid var(--line);background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--fill) 30%,transparent),transparent 60%),var(--hero)}
.stats{gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:8px}
.stat{border-radius:0;background:var(--solid);text-align:center;padding:10px 4px;align-content:center}
.stat span{font-size:11.5px}
.now-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.now-title{font-size:17px}
.now-sub{font-size:13px}
.nowcard{transition:border-color .15s,transform .15s}
.newscard .row:last-child{gap:4px!important}
.task.tp-urgent{background:linear-gradient(90deg,color-mix(in srgb,#F07A3A 16%,transparent),transparent 70%)}
.task.tp-high{background:linear-gradient(90deg,color-mix(in srgb,#E8B83A 12%,transparent),transparent 70%)}
.task.tp-medium{background:none}
.padd .addtask:has(input:placeholder-shown) .btn{display:none}
.padd .addtask input{border-style:dashed;background:transparent}
.padd .addtask input:focus{border-style:solid;background:var(--field)}
.bubble{border-radius:18px;padding:8px 12px}
.msg.mine .bubble{border-bottom-right-radius:6px}
.msg:not(.mine) .bubble{border-bottom-left-radius:6px}
#chat-input{border-radius:22px;padding:10px 16px;min-height:44px}
.attach{width:44px;height:44px;border-radius:50%}
#chat-send{border-radius:22px;min-height:44px;padding-inline:18px}
.alerts{border-radius:22px}
.ping{border-radius:18px}

/* tasks: groups in My tasks, tasks still waiting, who needs a task next, quick due dates, links in notes */
.mgroup{display:flex;align-items:baseline;gap:8px;min-width:0;padding:14px 0 6px;border-top:1px solid var(--line);font-size:13px}
.mgroup:first-child{padding-top:2px;border-top:0}
.mgroup b{font:700 12px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}

.mhint{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mgroup.wait b{color:var(--warn)}
@media (max-width:600px){.mhint{display:none}}
.task.blocked:not(.open) .ttext{color:var(--muted)}
.task.blocked input[type=checkbox]{opacity:.55}
.needchip{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.waitwarn{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;font-weight:500}
.waitwarn .btn.quiet{color:var(--warn)}
.qd{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font:600 12.5px/1 var(--body);cursor:pointer}
.qd:hover{border-color:var(--accent)}
.qd[aria-pressed="true"]{background:var(--fill);border-color:var(--fill);color:var(--on-accent)}
.notelink{color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.task .meta .btn.small{padding:4px 10px;min-height:0;font-size:12.5px}
.task.flash{animation:taskflash 1.6s ease}

.checklist .track{margin:2px 0 6px}

/* money: where the money went, goals, subscriptions */
.agree-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}

.flowlegend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px}
.flowlegend div{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0}
.flowlegend i{width:10px;height:10px;border-radius:3px;flex:none}

.fundcard .adgrid{margin-top:4px}

.goalname{border:0;background:none;padding:0;color:var(--ink);font:600 15px/1.3 var(--body);text-align:left;cursor:pointer;min-width:0}

.goalrow.reached .goalname{color:var(--muted)}
.goaldetail{display:grid;gap:8px;background:var(--field);border-radius:12px;padding:12px;font-size:14px}
.goalform{display:grid;gap:8px;background:var(--field);border-radius:14px;padding:12px;margin:6px 0}
.subpay{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;background:var(--field);border-radius:12px;padding:10px 12px;font-size:14px;margin:2px 0 6px}
.subpay>span{flex:1 1 180px}
/* settings: sections with a title, rows with a label on the left and the control on the right */
.setnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;padding:6px 0;background:color-mix(in srgb,var(--bg) 88%,transparent)}
.setsec{display:grid;gap:10px;margin-top:22px;scroll-margin-top:110px}

.setrow{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.idea>.setrow:first-child{border-top:0;padding-top:2px}
.idea>.setrow:last-child{padding-bottom:2px}
.setrow-t{flex:1 1 220px;display:grid;gap:2px;min-width:0}
.setrow-t b{font-size:15px}
.setrow-t span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.setrow-c{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.setrow-c:empty{display:none}
.setrow-c .addtask{min-width:min(100%,280px)}
.setdetails summary{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;cursor:pointer;list-style:none}
.setdetails summary::-webkit-details-marker{display:none}
.setdetails summary b::after{content:" \203A";color:var(--muted)}
.setdetails[open] summary{margin-bottom:10px}
.projset{gap:0}
.psgroup{display:grid;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.projset>.row:first-child{padding-bottom:12px}
.projset .renameblock{border-bottom:0;padding-bottom:0}
.projset .danger{margin:0;padding:0;border:0}

/* alerts setup: a checklist, steps and fixes */
.alertsetup{gap:12px}
.chklist{display:grid;gap:2px;border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.chk{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.chk:first-child{border-top:0}
.chk-i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--body);background:var(--line);color:var(--muted)}
.chk.ok .chk-i{background:var(--keep-soft);color:var(--keep)}
.chk.bad .chk-i{background:var(--drop-soft);color:var(--drop)}
.chk-t{flex:1 1 200px;display:grid;gap:1px;min-width:0}
.chk-t b{font-size:14.5px}
.chk-t span{font-size:13px;color:var(--muted)}
.chk-a{display:flex;gap:6px;margin-left:auto}
.setsteps{margin:0;padding-left:22px;display:grid;gap:12px}
.setsteps li{padding-left:4px}
.setsteps li::marker{font-weight:800;color:var(--accent)}
.setsteps li>b{display:block;font-size:14.5px}
.setsteps li>span{display:block;font-size:13.5px;color:var(--muted);margin:2px 0 6px}
.fixsteps{margin:8px 0 4px;padding-left:20px;display:grid;gap:6px;font-size:14px}
.copybox{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px;margin:4px 0;min-width:0}
.copybox code{flex:1;min-width:0;font:12.5px/1.4 ui-monospace,Menlo,monospace;overflow-wrap:anywhere;color:var(--ink)}
.fixlist{display:grid;gap:4px}
.fix{border:1px solid var(--line);border-radius:12px;padding:2px 12px}
.fix-h{width:100%;text-align:left;border:0;background:none;color:var(--ink);font:600 14px/1.3 var(--body);padding:10px 0;cursor:pointer}
.fix-h::after{content:" \203A";color:var(--muted)}
.fix.open .fix-h::after{content:" \2304"}
.fix.open{background:var(--field)}

/* chat: header, people, roles, emoji, reactions */
.chat-who{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:2px 0 8px;white-space:normal;overflow:visible;background:var(--surface);border:1px solid var(--line);border-radius:16px;font-size:13px}
.chat-who>.av,.chat-who>img{width:34px;height:34px;flex:none}
.who-n{display:grid;gap:1px;min-width:0;flex:1}
.who-n b{font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-n .label{text-transform:none;letter-spacing:0}
.who-lock{font-size:12px;color:var(--muted);white-space:nowrap}
.teamdot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--fill);color:#fff;font:800 12px/1 var(--body);flex:none}
.teamdot.big{width:34px;height:34px;border-radius:11px;font-size:16px}
.pchip[aria-pressed="true"] .teamdot{background:rgba(255,255,255,.22)}
.rolebadge{display:inline-block;justify-self:start;font:700 10.5px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px;white-space:nowrap}
.who-n .rolebadge{margin-left:0}
.rolebadge.partner{background:var(--warn-soft);color:var(--warn)}
.chipsep{flex:none;align-self:center;font:700 10.5px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 4px 0 8px;border-left:1px solid var(--line);margin-left:4px}
.partnerchip:not([aria-pressed="true"]){border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.bubwrap{display:grid;gap:3px;min-width:0;justify-items:start}
.msg.mine .bubwrap{justify-items:end}
.bubble .msg-text{white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .notelink{color:inherit;text-decoration:underline;font-weight:600}
.bubble.emoji-only{background:none!important;padding:0 2px}
.bubble.emoji-only .msg-text{font-size:38px;line-height:1.15}
.bubble.emoji-only .msg-time{color:var(--muted);opacity:1}
.reacts{display:flex;gap:4px;flex-wrap:wrap;margin-top:-2px}
.react{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 7px;font-size:13px;line-height:1.3;cursor:pointer}
.react b{font:700 11.5px/1 var(--body);color:var(--muted)}
.react.mine{border-color:var(--accent);background:var(--accent-soft)}
.reactbar{display:flex;gap:2px;align-self:flex-start;margin:2px 0 2px 30px;padding:4px;border-radius:999px;background:var(--solid);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.reactbar.mine{align-self:flex-end;margin-left:0}
.emo{border:0;background:none;font-size:22px;line-height:1;width:38px;height:38px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:transform .12s,background .12s}
.emo:hover,.emo.on{background:var(--accent-soft)}
.emo:active{transform:scale(.88)}
.emo.more{font:700 18px/1 var(--body);color:var(--muted)}
.emojipanel{max-height:240px;overflow-y:auto;background:var(--solid);border:1px solid var(--line);border-radius:16px;padding:8px 8px 4px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(100%,380px);box-sizing:border-box}
.emg-h{font:700 10.5px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 4px}
.emg-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr))}
.emojipanel .emo{width:auto;height:36px;font-size:21px;border-radius:10px}
.cv-emoji{display:flex}
.cv-emoji:empty{display:none}
.msg-actions .emojipanel{margin:2px 0}
.seen{align-self:flex-end;font-size:11.5px;color:var(--muted);margin:-1px 4px 4px}
.sysline{align-self:center;max-width:92%;text-align:center;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:999px;padding:4px 10px;margin:4px 0;overflow-wrap:anywhere}
.chatlog.cv{height:auto;min-height:200px;max-height:calc(100dvh - 400px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));margin-bottom:8px}
@media (min-width:760px){.chatlog.cv{max-height:calc(100dvh - 380px)}}
.cv-compose{display:grid;gap:8px}
.cv-compose textarea{resize:none;max-height:140px}
.msg-del{border:0;background:none;color:inherit;opacity:.6;font-size:11px;margin-left:6px;padding:0;cursor:pointer}
.msg-del:hover{opacity:1}
#chat-input{overflow-y:auto}
#chat-input::placeholder,.cv-compose textarea::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idea>.setdetails{padding:12px 0;border-top:1px solid var(--line)}

.chatrow{display:flex;align-items:center;gap:8px;min-width:0}
.chatrow .pchips{flex:1;min-width:0;padding-bottom:6px}
.chatrow-l{flex:none;width:58px;font:700 10.5px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
.chatrow.partners .chatrow-l{color:var(--warn)}

/* search, weekly summary, getting started, meeting tasks, partner and client bits */
.searchbox{gap:8px}
.sresults{display:grid;gap:2px;max-height:min(60vh,520px);overflow-y:auto}
.sres{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:0;background:none;border-radius:12px;padding:9px 10px;color:var(--ink);cursor:pointer}
.sres:hover,.sres:focus-visible{background:var(--bg)}
.skind{flex:none;font:700 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:5px 6px;margin-top:2px;min-width:52px;text-align:center}
.stext{display:grid;gap:1px;min-width:0}.stext b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stext span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weekly{align-self:stretch;margin:10px 4px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--fill) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));font-size:14px;line-height:1.6}
.weekly-h{font:700 11px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.welcome{margin-top:12px;gap:10px}
.mtrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.mtrow .noteinput{padding:7px 10px}
.wonbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--keep-soft);color:var(--keep);font-weight:600;font-size:14px}
.partnerrow{gap:8px;flex-wrap:wrap}
.rolebadge.client{background:var(--keep-soft);color:var(--keep)}
.fs-partner{background:#C9A15B}
.paycard{gap:10px}
@media (max-width:520px){.mtrow{grid-template-columns:auto minmax(0,1fr)}.mtrow select{grid-column:2}}

/* settings like a phone's Settings app: profile card, grouped rows, a page for each */
.setsearch{margin:0 0 12px}
.setprofile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;color:var(--ink);cursor:pointer;box-shadow:var(--lift)}
.setprofile .av{width:54px;height:54px;border:0}
.setprofile .who-n b{font-size:17px}
.setprofile:hover,.setrowbtn:hover{border-color:var(--accent)}
.setgroup{margin-top:20px}
.setgroup-h{font:700 11.5px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 6px 8px}
.setlist{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--lift)}
.setrowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 14px;color:var(--ink);font:500 15px/1.3 var(--body);cursor:pointer;min-height:52px}
.setrowbtn:first-child{border-top:0}
.setrowbtn:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.setrowbtn.danger{justify-content:center;color:var(--drop);font-weight:600}
.seticon{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:16px;line-height:1;color:#fff}
.setrow-name{flex:1;min-width:0}
.setrow-val{color:var(--muted);font-size:13.5px;text-align:right;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev2{color:var(--muted);font-size:20px;line-height:1;flex:none}
.setfoot{text-align:center;margin:18px 0 0;text-transform:none;letter-spacing:0}
.morebox{width:min(300px,calc(100vw - 24px));gap:2px;padding:8px}
.morehead{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:var(--bg);border-radius:14px;padding:10px;margin-bottom:4px;color:var(--ink);cursor:pointer}
.morehead .av{width:40px;height:40px;border:0}
.moreitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:10px;color:var(--ink);font:500 15px/1.2 var(--body);cursor:pointer}
.moreitem:hover{background:var(--bg)}
.moreitem.danger{color:var(--drop)}
.moreico{width:24px;text-align:center;font-size:17px}
.morediv{height:1px;background:var(--line);margin:4px 6px}

/* assistant: actions it can do for you */
.actcard{display:grid;gap:6px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface));border-radius:14px;padding:10px 12px;max-width:96%}
.actcard.ok{border-color:var(--keep);background:color-mix(in srgb,var(--keep-soft) 55%,var(--surface))}
.actcard.off{opacity:.6}
.actcard-h{font:700 11px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.actcard.ok .actcard-h{color:var(--keep)}
.actrow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.actrow:first-of-type{border-top:0}
.actrow-t{flex:1;display:grid;gap:2px;min-width:0;font-size:14px}
.actrow-t span{font-size:13px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.actrow.skip .actrow-t{text-decoration:line-through;opacity:.55}

  .toast{bottom:calc(var(--dock) + 22px + env(safe-area-inset-bottom,0px));border-radius:14px}
  .asst{bottom:calc(var(--dock) + 22px + env(safe-area-inset-bottom,0px));border-radius:24px}

  .idea,.compose{padding:16px;gap:12px}
  .focus{padding:18px;margin-bottom:14px}
  .list{gap:10px;margin-top:14px}

@media (max-width:759px) and (prefers-reduced-motion:reduce){.tab .ico,.btn,.nowcard{transition:none}.btn:active,.nowcard:active,.tab:active .ico{transform:none}}

/* ===== Tablets and computers ===== */
@media (min-width:760px){
  .topbar{border-bottom:1px solid var(--line)}
  .nav{border-radius:16px;background:color-mix(in srgb,var(--solid) 92%,transparent);box-shadow:var(--lift)}
  .tab{border-radius:11px;color:var(--muted)}
  .tab:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 5%,transparent)}
  .tab[aria-selected="true"]{background:var(--accent-soft)}
  .tab .ico{height:30px;border-radius:9px}
  .idea,.compose{padding:20px}
  .nowcard{padding:16px 18px}
  .nowcard:hover{transform:translateY(-1px)}
  .profile{padding:22px}
  .stat b{font-size:24px}
  .chatlog{border-radius:var(--r)}
}

/* ===== Computers: a sidebar instead of two bars, a wider page, two columns where it helps ===== */
@media (min-width:1024px){
  :root{--side:248px;--gut:clamp(28px,3.6vw,56px)}
  #app.wrap,#partner.wrap{max-width:none;margin:0 0 0 var(--side);padding:0 var(--gut) 64px}
  #app>section,#partner>section{max-width:1080px;margin-inline:auto}

  /* top bar: just the buttons on the right; the name moves to the sidebar */
  #app>.topbar,#partner>.topbar{margin:0 calc(-1 * var(--gut)) 26px;padding:14px var(--gut);background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
  #app>.topbar .brand,#partner>.topbar .brand{position:fixed;top:20px;left:22px;font-size:21px}
  .brand-sub{font-size:9.5px}

  /* sidebar */
  #app>.nav,#partner>.nav{position:fixed;inset:0 auto 0 0;width:var(--side);box-sizing:border-box;margin:0;display:flex;flex-direction:column;gap:3px;padding:92px 14px 24px;border:0;border-right:1px solid var(--line);border-radius:0;background:var(--solid);box-shadow:none;z-index:14}
  #app>.nav .tab,#partner>.nav .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;width:100%;padding:6px 12px 6px 6px;font-size:14.5px}
  #app>.nav .tab .ico,#partner>.nav .tab .ico{width:36px;height:32px}
  #app>.nav .tab svg,#partner>.nav .tab svg{width:19px;height:19px}
  #app>.nav .tab .count,#partner>.nav .tab .count{position:static;margin-left:auto}
  #app>.nav .settab{margin-top:auto}
  #app>.nav::before,#partner>.nav::before{content:"";position:absolute;left:14px;right:14px;top:76px;height:1px;background:var(--line)}

  /* Me: greeting and numbers side by side, the cards in two columns */
  #me{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
  #me>*{grid-column:1/-1;margin:0!important}
  #me>.profile{grid-column:1}
  #me>.stats{grid-column:2;margin:0;grid-template-rows:1fr}
  #me>.stat b,#me .stat b{font-size:30px}
  #me>.nowcard{grid-column:auto}
  #me>.nowcard:nth-child(odd of .nowcard):not(:has(~ .nowcard)){grid-column:1/-1}
  #me>.seg{margin-top:12px!important;max-width:420px}
  #me>.me-foot{margin-top:14px!important}

  /* Ideas: the pitch box on the left, the ideas on the right */
  #view-ideas{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:0 24px;align-items:start}
  #view-ideas>.compose{grid-column:1;grid-row:1/span 4;position:sticky;top:96px}
  #view-ideas>:not(.compose){grid-column:2}
  #view-ideas>.catbar{margin-top:0;margin-bottom:12px}
  #view-ideas>.list{margin-top:0}

  /* Projects: cards side by side */
  #projects>.list{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  #projects>.seg{max-width:420px}

  .focus{padding:26px 28px}
  .chatlog{height:clamp(320px,calc(100dvh - 300px),760px)}
  .alerts,.asst{top:76px}
}

</style>

<canvas id="stars" aria-hidden="true"></canvas>
<script>
// Background: a faint contour map (like a topographic map) with a slow prism scan.
// A soft band sweeps across now and then; the lines it passes light up in the tone colour first,
// then lift up in white (higher ground lifts more, the tone stays below like a shadow), then fade out pale.
// Calm on purpose: only the main map lines, soft light. It pauses when the page is hidden,
// stays still for people who turn off motion, and the "Background animation" setting can switch it off.
(function () {
  var c = document.getElementById("stars"), x = c.getContext("2d"), W = 0, H = 0, D = 1;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var TAU = Math.PI * 2, ANG = -0.35, CA = Math.cos(ANG), SA = Math.sin(ANG), PER = 9000;
  function on() { try { return localStorage.getItem("meteors") !== "off" } catch (e) { return true } }
  // smooth random heights for the map
  function hash(i, j) { var h = (i * 374761393 + j * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295 }
  function vn(px, py) { var i = Math.floor(px), j = Math.floor(py), fx = px - i, fy = py - j, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    var a = hash(i, j), b = hash(i + 1, j), cc = hash(i, j + 1), d = hash(i + 1, j + 1); return a + (b - a) * u + (cc - a) * v + (a - b - cc + d) * u * v }
  function fbm(px, py) { var s = 0, amp = .55, f = 1; for (var o = 0; o < 3; o++) { s += vn(px * f, py * f) * amp; amp *= .45; f *= 2.02 } return s / .83 }
  var SEG = { 1: [[3, 2]], 2: [[2, 1]], 3: [[3, 1]], 4: [[0, 1]], 5: [[3, 0], [2, 1]], 6: [[0, 2]], 7: [[3, 0]], 8: [[3, 0]], 9: [[0, 2]], 10: [[0, 1], [3, 2]], 11: [[0, 1]], 12: [[3, 1]], 13: [[2, 1]], 14: [[3, 2]] };
  var LEVELS = [5 / 15, 10 / 15].map(function (k) { return .15 + .75 * k });   // the two main map lines
  // colours: read the tone from the page, so light and dark themes both work
  var light = false, pine = false, tone = [13, 94, 99], C = {};
  function colours() {
    light = document.documentElement.getAttribute("data-theme") === "light";
    var t = getComputedStyle(document.documentElement).getPropertyValue("--tone").trim() || "#0D5E63";
    tone = [parseInt(t.slice(1, 3), 16), parseInt(t.slice(3, 5), 16), parseInt(t.slice(5, 7), 16)];
    var mix = function (k) { return tone.map(function (v) { return v + (255 - v) * k }) };
    pine = document.documentElement.getAttribute("data-theme") === "pine";
    C = light ? { base: [17, 24, 31], lead: tone, mid: [17, 24, 31], trail: mix(.35) }
      : pine ? { base: [255, 255, 255], base2: [178, 186, 194], lead: [196, 202, 208], mid: [255, 255, 255], trail: [150, 158, 166] }   // white and grey lines
      : { base: [255, 255, 255], lead: mix(.45), mid: [255, 255, 255], trail: mix(.68) };
  }
  function rgba(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + a + ")" }
  function size() { D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; c.width = W * D; c.height = H * D; x.setTransform(D, 0, 0, D, 0, 0); still() }
  function map(t) {
    var s = W < 700 ? 9 : 10, cols = Math.ceil(W / s) + 2, rows = Math.ceil(H / s) + 2, T = t * .00002, sc = s * .0024, F = new Float32Array(cols * rows), out = [];
    for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) F[j * cols + i] = fbm(i * sc + T, j * sc - T * .7);
    LEVELS.forEach(function (v) {
      for (var j = 0; j < rows - 1; j++) for (var i = 0; i < cols - 1; i++) {
        var a = F[j * cols + i], b = F[j * cols + i + 1], cc = F[(j + 1) * cols + i + 1], d = F[(j + 1) * cols + i];
        var k = (a > v ? 8 : 0) | (b > v ? 4 : 0) | (cc > v ? 2 : 0) | (d > v ? 1 : 0); if (k === 0 || k === 15) continue;
        var e = [[i + (v - a) / (b - a), j], [i + 1, j + (v - b) / (cc - b)], [i + (v - d) / (cc - d), j + 1], [i, j + (v - a) / (d - a)]];
        SEG[k].forEach(function (pq) { out.push([e[pq[0]][0] * s, e[pq[0]][1] * s, e[pq[1]][0] * s, e[pq[1]][1] * s, v]) });
      }
    });
    return out;
  }
  function base(segs) {
    if (C.base2) {   // pine: the first map line in white, the second in grey
      [[C.base, .5, LEVELS[0], 1.6], [C.base2, .34, LEVELS[1], 1.25]].forEach(function (b) {
        x.strokeStyle = rgba(b[0], b[1]); x.lineWidth = b[3]; x.beginPath();
        segs.forEach(function (g) { if (g[4] === b[2]) { x.moveTo(g[0], g[1]); x.lineTo(g[2], g[3]) } }); x.stroke();
      });
      return;
    }
    x.strokeStyle = rgba(C.base, light ? .16 : .15); x.lineWidth = 1.25; x.beginPath(); segs.forEach(function (g) { x.moveTo(g[0], g[1]); x.lineTo(g[2], g[3]) }); x.stroke() }
  function still() { x.clearRect(0, 0, W, H); colours(); base(map(0)) }
  var bw = function () { return W < 700 ? 110 : 170 };
  function lp(px, py, pos) { var d = (px - pos) * CA + (py - H / 2) * SA, u = Math.max(0, 1 - Math.abs(d) / (bw() * .6)); return u * u * (3 - 2 * u) }
  function frame(t) {
    if (!document.hidden) {
      x.clearRect(0, 0, W, H);
      var segs = map(t), sx = -W * .3 + ((t % PER) / PER) * W * 1.6, gap = W < 700 ? 50 : 80, lh = (W < 700 ? 55 : 85) * .45;
      base(segs);
      x.save(); x.globalCompositeOperation = light ? "source-over" : "lighter"; x.lineWidth = 1.2;
      // tone first and low (a shadow), white in the middle lifting up, pale last
      [[-1, sx + gap, C.lead, .85, 0], [0, sx, C.mid, .6, 1], [1, sx - gap, C.trail, .7, .5]].forEach(function (cp) {
        var n = cp[0], pos = cp[1], col = cp[2], al = cp[3] * .6, share = cp[4];
        for (var b = 0; b < 5; b++) {
          var lo = b / 5, hi = (b + 1) / 5, lm = (lo + hi) / 2, any = false;
          x.strokeStyle = rgba(col, al * (.25 + .75 * lm) * (light ? .8 : 1)); x.beginPath();
          for (var q = 0; q < segs.length; q++) {
            var g = segs[q], l = lp((g[0] + g[2]) / 2, (g[1] + g[3]) / 2, pos); if (l <= .04 || l < lo || l >= hi) continue; any = true;
            var l1 = lp(g[0], g[1], pos), l2 = lp(g[2], g[3], pos), v = g[4];
            var k1 = Math.sin(l1 * Math.PI / 2) * 8 * (v - .05) * 2 * .6 * n, k2 = Math.sin(l2 * Math.PI / 2) * 8 * (v - .05) * 2 * .6 * n;
            x.moveTo(g[0] + k1, g[1] + k1 * .35 - l1 * (v - .1) * lh * share); x.lineTo(g[2] + k2, g[3] + k2 * .35 - l2 * (v - .1) * lh * share);
          }
          if (any) x.stroke();
        }
      });
      x.restore();
    }
    if (running) requestAnimationFrame(frame);
  }
  var running = false;
  function start() { if (reduce || !on()) { running = false; still(); return } if (!running) { running = true; colours(); requestAnimationFrame(frame) } }
  window.pitchBackground = function () { running = false; setTimeout(start, 30) };   // the Look setting calls this
  new MutationObserver(function () { colours(); if (!running) still() }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "style"] });
  size(); addEventListener("resize", function () { clearTimeout(size.t); size.t = setTimeout(size, 200) });
  start();
})();
</script>

/* ----- money engine: the split maths (pure functions, no page code) -----
   All amounts are handled in piasters (1 EGP = 100) so totals always add up exactly.

   Order for every bit of money that comes in:
     1. pay back costs people paid from their own pocket (oldest first)
     2. the partner's commission, when a partner abroad brought the client (a % or a fixed amount)
     3. team fund %         (of what's left)
     4. finder's fee %      (to whoever on the team brought the client, when it applies)
     5. the rest is split by the agreed shares
   Currencies: a deal can be priced in any currency. Each payment records the rate to EGP on the day,
   and everything that's shared (costs, commission, fund, shares) is in EGP, so the split is exact.
   One-time projects: costs are paid back as money arrives, but the profit is only split
   once the client has fully paid. Monthly and installment deals split every payment.
   A deal that's only a proposal has no payments due yet, so nothing can be late.
   When a deal is over (a one-time project fully paid, or any deal marked Ended) and costs
   are still owed back, the team fund covers them: nobody stays out of pocket. */

const MONEY_DEFAULTS = { fundPct: 40, findPct: 5, finderMonths: 3, pauseAfterLate: 2, reviewMonths: 2, version: 2 };
const toP = x => Math.round((Number(x) || 0) * 100);
const monthOf = d => (d || "").slice(0, 7);
function addMonths(ym, n) { const [y, m] = ym.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}` }
function monthsBetween(a, b) { const [y1, m1] = a.split("-").map(Number), [y2, m2] = b.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1) }

// Split an amount by percentage shares; leftover piasters go to the biggest share so nothing is lost.
function splitByShares(amount, shares) {
  const ids = Object.keys(shares || {}).filter(u => Number(shares[u]) > 0);
  const total = ids.reduce((s, u) => s + Number(shares[u]), 0);
  const out = {};
  if (!ids.length || amount <= 0) return out;
  let given = 0;
  for (const u of ids) { out[u] = Math.floor(amount * Number(shares[u]) / total); given += out[u] }
  const biggest = ids.slice().sort((a, b) => Number(shares[b]) - Number(shares[a]))[0];
  out[biggest] += amount - given;
  return out;
}

function computeMoney(p, todayStr, rules) {
  const m = p.money || {}, R = { ...MONEY_DEFAULTS, ...(rules || {}) };
  const fundPct = m.fundCustom && m.fundPct != null ? Number(m.fundPct) : R.fundPct;
  // who brought the client: one or several people share the finder's fee; "the team" puts it in the fund
  const finders = m.finderTeam ? [] : (Array.isArray(m.finders) ? m.finders : (m.finder ? [m.finder] : [])).filter(Boolean);
  const hasFinder = m.finderTeam || finders.length > 0;
  const findPct = hasFinder ? (m.findCustom && m.findPct != null ? Number(m.findPct) : R.findPct) : 0;
  const type = m.type || "one";
  const list = o => Object.entries(o || {}).filter(([, v]) => v && v.amount != null).map(([id, v]) => ({ id, ...v }))
    .sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.at || 0) - (b.at || 0));
  const payments = list(p.payments), costs = list(p.costs), payouts = list(p.payouts), ads = list(p.ads);
  const cur = m.currency || "EGP", dealRate = cur === "EGP" ? 1 : Number(m.rate) || 1;
  const egp = x => Math.round(toP(x.amount) * (cur === "EGP" ? 1 : Number(x.rate) || dealRate));   // a payment in EGP
  // the partner abroad who brought the client: a % of each split, or a fixed amount taken until it's paid in full
  const pa = m.partner && m.partner.email ? m.partner : null;
  const paMode = pa ? (pa.mode === "fixed" ? "fixed" : "pct") : null, paVal = pa ? Number(pa.value) || 0 : 0;
  let paLeft = paMode === "fixed" ? toP(paVal) : 0;

  const proposal = m.stage === "proposal", ended = m.stage === "ended";
  const res = { type, currency: cur, rate: dealRate, receivedEGP: 0, partner: pa ? { email: pa.email, name: pa.name || pa.email, mode: paMode, value: paVal, earned: 0, paid: 0 } : null, proposal, ended, fundPct, findPct, finders, finderTeam: !!m.finderTeam, received: 0, expected: 0, costsTotal: 0, costsUnpaid: 0, fund: 0, finderAmt: 0, fundCover: 0,
    people: {}, unassigned: 0, pending: false, held: 0, preview: null, schedule: [], late: [], monthsUnpaid: 0, ads: { in: 0, spent: 0, held: 0 } };
  const person = u => res.people[u] || (res.people[u] = { earned: 0, back: 0, paid: 0, balance: 0 });

  // costs queue: paid back in order
  const queue = costs.map(c => ({ by: c.paidBy, left: toP(c.amount) }));
  res.costsTotal = queue.reduce((s, q) => s + q.left, 0);
  const reimburse = avail => {
    for (const q of queue) { if (avail <= 0) break; const take = Math.min(avail, q.left); if (!take) continue; q.left -= take; avail -= take; if (q.by) person(q.by).back += take; else res.unassigned += take }
    return avail;
  };
  const commission = (amt, withPartner, into) => {
    if (!pa || amt <= 0 || (paMode === "pct" && !withPartner)) return 0;   // a fixed amount keeps being paid until it's done
    let c = 0;
    if (paMode === "pct") c = Math.round(amt * paVal / 100);
    else { c = Math.min(amt, into ? toP(paVal) : paLeft); if (!into) paLeft -= c }
    if (into) into.partner = (into.partner || 0) + c; else res.partner.earned += c;
    return c;
  };
  const splitProfit = (amt, shares, withFinder, into) => {
    const t = into || res; if (amt <= 0) return;
    amt -= commission(amt, withFinder, into); if (amt <= 0) return;
    const fund = Math.round(amt * fundPct / 100), find = withFinder && hasFinder ? Math.round(amt * findPct / 100) : 0;
    t.fund += fund; t.finderAmt += find;
    const rest = amt - fund - find, parts = splitByShares(rest, shares);
    const pp = u => (into ? (into.people[u] || (into.people[u] = { earned: 0 })) : person(u));
    if (find && m.finderTeam) t.fund += find;
    else if (find) for (const [u, v] of Object.entries(splitByShares(find, Object.fromEntries(finders.map(u => [u, 1]))))) pp(u).earned += v;

  if (type === "one") {
    res.expected = toP(m.price);
    const avail = reimburse(res.receivedEGP);
    if (res.expected > 0 && res.received >= res.expected) splitProfit(avail, m.shares, true);
    else {

      // what it will look like once fully paid (assuming no more costs)

      const avail = reimburse(egp(x));

  const over = ended || (type === "one" && res.expected > 0 && res.received >= res.expected);
  if (over) for (const q of queue) if (q.left > 0) { res.fundCover += q.left; res.fund -= q.left; if (q.by) person(q.by).back += q.left; else res.unassigned += q.left; q.left = 0 }

  // payment schedule and late payments
  const nowM = monthOf(todayStr), day = Number((todayStr || "").slice(8, 10)) || 1, dueDay = Number(m.dueDay) || 5;
  const pastDue = mm => mm < nowM || (mm === nowM && day > dueDay);
  if (type === "monthly" && toP(m.monthlyFee) > 0) {
    const fee = toP(m.monthlyFee), startM = m.startMonth || nowM;
    // an ended deal stops at its end month, or else the last month the client paid for
    const paidMonths = payments.filter(x => x.kind === "monthly" && x.month).map(x => x.month).sort();
    const endM = m.endMonth || (ended ? m.endedMonth || paidMonths[paidMonths.length - 1] || startM : "");
    if (toP(m.setupFee) > 0) {
      const got = payments.filter(x => x.kind === "setup").reduce((s, x) => s + toP(x.amount), 0);
      res.schedule.push({ label: "Setup fee", month: startM, expected: toP(m.setupFee), received: got, status: got >= toP(m.setupFee) ? "paid" : pastDue(startM) ? "late" : "due" });
    }
    const last = endM && endM < addMonths(nowM, 1) ? endM : addMonths(nowM, 1);
    for (let mm = startM, i = 0; mm <= last && i < 120; mm = addMonths(mm, 1), i++) {

      const got = payments.filter(x => x.kind === "monthly" && x.month === mm).reduce((s, x) => s + toP(x.amount), 0);
      res.schedule.push({ label: mm, month: mm, expected: fee, received: got, status: got >= fee ? "paid" : pastDue(mm) ? "late" : mm === nowM ? "due" : "upcoming" });
    }

  } else if (type === "installments" && toP(m.price) > 0) {
    const n = Math.max(1, Number(m.installments) || 1), total = toP(m.price), each = Math.floor(total / n), startM = m.startMonth || nowM;
    let pool = payments.reduce((s, x) => s + toP(x.amount), 0);
    for (let i = 0; i < n; i++) {
      const amt = i === n - 1 ? total - each * (n - 1) : each, mm = addMonths(startM, i), got = Math.min(pool, amt); pool -= got;
      res.schedule.push({ label: `Payment ${i + 1} of ${n}`, month: mm, expected: amt, received: got, status: got >= amt ? "paid" : pastDue(mm) ? "late" : mm === nowM ? "due" : "upcoming" });
    }

  } else if (type === "one" && res.expected > 0) {
    res.schedule.push({ label: "Total", month: nowM, expected: res.expected, received: res.received, status: res.received >= res.expected ? "paid" : "due" });
  }
  // a proposal hasn't been agreed yet: nothing is due or late, and nothing is expected this month
  if (proposal) for (const s of res.schedule) if (s.status === "late" || s.status === "due") s.status = "upcoming";
  if (proposal && type === "monthly") res.expected = 0;
  if (ended) for (const s of res.schedule) if (s.status === "upcoming" || s.status === "due") s.status = s.received >= s.expected ? "paid" : "late";
  res.late = res.schedule.filter(s => s.status === "late");
  res.monthsUnpaid = type === "monthly" ? res.late.filter(s => s.label !== "Setup fee").length : 0;

  // payouts: money actually handed to people
  for (const x of payouts) { if (x.toPartner) { if (res.partner) res.partner.paid += toP(x.amount) } else if (x.to) person(x.to).paid += toP(x.amount) }
  for (const [u, v] of Object.entries(res.people)) v.balance = v.earned + v.back - v.paid;

  for (const a of ads) { if (a.kind === "spent") res.ads.spent += toP(a.amount); else res.ads.in += toP(a.amount) }

  return res;
}

// Shares suggested from who has which tasks (bigger checklists count a bit more).
function suggestShares(tasks, people) {
  const w = {};
  for (const t of tasks) {
    const who = people(t); if (!who.length) continue;
    const weight = 1 + Math.min(3, Object.keys(t.check || {}).length * 0.25) + (t.priority === "urgent" ? 0.5 : t.priority === "high" ? 0.25 : 0);
    for (const u of who) w[u] = (w[u] || 0) + weight / who.length;
  }
  const total = Object.values(w).reduce((s, x) => s + x, 0); if (!total) return {};
  const out = {}; let given = 0; const ids = Object.keys(w).sort((a, b) => w[b] - w[a]);
  for (const u of ids) { out[u] = Math.floor(w[u] / total * 100); given += out[u] }
  out[ids[0]] += 100 - given;
  return out;
}

/* ---------- shared state ---------- */

function csvSplit(line) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === '"' && line[i + 1] === '"') { cur += '"'; i++ } else if (c === '"') q = false; else cur += c }
    else if (c === '"') q = true; else if (c === ",") { out.push(cur.trim()); cur = "" } else cur += c;
  }
  out.push(cur.trim()); return out;
}
// Finds the phone number inside a line of plain text, and splits what's left on dashes, bars or tabs.

function looseLead(line) {
  const found = (String(line || "").match(/\+?\(?\d[\d\s().\-\/]{5,}\d/g) || []).filter(x => leadDigits(x).length >= 7 && !/^\s*(\d{4}[-/.]\d{1,2}[-/.]\d{1,2}|\d{1,2}[-/.]\d{1,2}[-/.]\d{2,4})\s*$/.test(x));
  if (!found.length) return null;
  const phone = found.sort((a, b) => leadDigits(b).length - leadDigits(a).length)[0].trim();
  const parts = String(line).replace(phone, " ").replace(/^\s*\d{1,3}\s*[.)]\s*/, "")
    .split(/\s*[–—|·\t]\s*|\s+-\s+/).map(x => x.trim().replace(/^[\s,:;-]+|[\s,:;-]+$/g, "")).filter(Boolean);
  return { phone, parts };
}
// Works with rows copied from Google Sheets or Excel (tabs), or CSV, or a plain typed list with one number per line.
// A header row is used when there is one.
function parseLeads(text, gid, checkBoard = true) {
  const lines = String(text || "").split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { rows: [], noPhone: 0, dupes: 0, repeats: [], skipped: [] };
  const sep = lines[0].includes("\t") ? "\t" : (lines[0].includes(";") && !lines[0].includes(",")) ? ";" : ",";
  const cells = lines.map(l => sep === "," ? csvSplit(l) : l.split(sep).map(x => x.trim()));
  const isPhone = v => leadDigits(v).length >= 7 && /^[\d\s+()\-./]+$/.test(String(v).trim());
  const H = cells[0].map(x => x.toLowerCase());
  const hasHeader = !cells[0].some(isPhone) && !looseLead(lines[0]) && H.some(h => /phone|number|mobile|tel|whats|رقم|هاتف|موبايل|جوال/.test(h));
  const ix = { phone: -1, biz: -1, name: -1, city: -1 };
  if (hasHeader) {
    const find = (re, not = []) => H.findIndex((h, n) => re.test(h) && !not.includes(n));
    ix.phone = find(/phone|number|mobile|tel|whats|رقم|هاتف|موبايل|جوال/);
    ix.biz = find(/business|company|shop|store|brand|clinic|restaurant|شركة|نشاط|محل/, [ix.phone]);
    ix.name = find(/name|contact|client|owner|person|اسم|عميل/, [ix.phone, ix.biz]);
    ix.city = find(/city|area|location|country|address|مدينة|منطقة|عنوان/, [ix.phone, ix.biz, ix.name]);
  }
  const seen = new Set(); // numbers met earlier in this same paste
  const rows = [], repeats = [], skipped = []; let noPhone = 0, dupes = 0;
  for (const r of hasHeader ? cells.slice(1) : cells) {
    let phone, name = "", biz = "", city = "", extra = [];
    if (hasHeader) {
      phone = r[ix.phone] || ""; name = ix.name >= 0 ? r[ix.name] || "" : ""; biz = ix.biz >= 0 ? r[ix.biz] || "" : ""; city = ix.city >= 0 ? r[ix.city] || "" : "";
      r.forEach((v, n) => { if (v && ![ix.phone, ix.name, ix.biz, ix.city].includes(n)) extra.push((cells[0][n] ? cells[0][n] + ": " : "") + v) });
    } else {
      const pi = r.findIndex(isPhone);
      if (pi >= 0) {
        phone = r[pi];
        const rest = r.filter((v, n) => n !== pi && v); name = rest[0] || ""; biz = rest[1] || ""; extra = rest.slice(2);
      } else {
        // a line typed as a list, like "1. Shop name – City – +46 72 877 32 83": the shop comes first, then the city
        const lo = looseLead(r.join(" – "));
        phone = lo ? lo.phone : ""; biz = lo ? lo.parts[0] || "" : ""; city = lo ? lo.parts[1] || "" : ""; extra = lo ? lo.parts.slice(2) : [];
      }
    }
    const d = leadDigits(phone);
    if (d.length < 6) { noPhone++; skipped.push(r.filter(Boolean).join(" ").replace(/^\s*\d{1,3}\s*[.)]\s*/, "").slice(0, 60)); continue }
    const k = leadKey(phone), where = seen.has(k) ? "twice in what you pasted" : checkBoard ? leadWhere(phone, gid) : "";
    if (where) { dupes++; repeats.push({ phone: phone.trim(), title: biz || name || "", why: where }); continue }
    seen.add(k);
    rows.push({ phone: phone.trim(), name: name.slice(0, 80), biz: biz.slice(0, 80), city: city.slice(0, 60), extra: extra.join(" · ").slice(0, 400) });

}

}
const progressOf = list => { const d = list.filter(t => t.done).length; return { total: list.length, done: d, pct: pctOf(d, list.length) } };

/* ---------- smart helper: who should do what ---------- */

function suggest(p) {
  const tasks = tasksOf(p);
  const open = tasks.filter(t => !t.done && !t.owner);
  const joined = Object.entries(p.members || {}).filter(([, v]) => v).map(([u]) => u);
  const pool = joined.length >= 2 ? joined : teamIds();
  if (!pool.length) return [];
  const load = Object.fromEntries(pool.map(u => [u, tasks.filter(t => !t.done && t.owner === u).length]));
  const out = [];
  for (const t of open) {
    let best = null;
    for (const u of pool) {
      const prof = people[u] || {};
      const sk = prof.skills ? (prof.skills[t.skill] ?? 0) : 0.35;
      const grow = (prof.grow || []).includes(t.skill) ? 0.12 : 0;
      const score = sk + grow - 0.12 * load[u];
      if (!best || score > best.score) best = { u, score, sk, grow, hasQuiz: !!prof.skills };
    }
    load[best.u]++;
    const skillName = t.skill ? SKILLS[t.skill].name.toLowerCase() : "general";
    let why;
    if (!t.skill) why = `Spreads the work evenly`;
    else if (!best.hasQuiz) why = `Hasn't taken the skills quiz yet, so picked to spread the work`;
    else if (best.grow && best.sk < 0.5) why = `Wants to get better at ${skillName} work`;
    else why = `${SKILLS[t.skill].name} score ${Math.round(best.sk * 100)}%` + (best.grow ? `, and wants to grow in it` : "");
    out.push({ task: t, owner: best.u, why });
  }
  return out;
}

function ymdOk(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + "T12:00").getTime()) }
function toYmd(raw) {

function matchPerson(raw) {

  const full = id => realName(id).toLowerCase(), first = id => full(id).split(" ")[0], mail = id => ((people[id] || {}).email || "").toLowerCase();
  const hit = ids.find(id => full(id) === q) || ids.find(id => first(id) === q) || ids.find(id => mail(id) === q || mail(id).split("@")[0] === q)

}
function matchSkill(raw) {

function parsePlan(text, p) {

  const strict = /^\s*(?:#{1,6}\s*)?(?:phase|stage)\b/im.test(text);
  const phaseNamed = nm => {
    const ex = existing.find(x => x.name.toLowerCase() === nm.toLowerCase());
    let ph = phases.find(x => x.name.toLowerCase() === nm.toLowerCase());
    if (!ph) { ph = { name: nm.slice(0, 40), existingId: ex ? ex.id : null, tasks: [] }; phases.push(ph) }
    return ph;
  };
  for (const rawLine of text.replace(/\r/g, "").split("\n")) {
    const line = rawLine.replace(/\*\*/g, "").trimEnd(); const t = line.trim();
    if (!t || t.startsWith("```")) continue;
    let m;
    if ((m = t.match(/^(?:#{1,6}\s*)?(?:phase|stage|step)\s*\d*\s*[:.\-–—]\s*(.+)$/i)) || (m = t.match(/^#{1,6}\s+(.+)$/)) || (!strict && !/^[-*•]|^\d+[.)]/.test(t) && (m = t.match(/^(.{2,40}):$/)))) {
      cur = phaseNamed(m[1].trim().replace(/:$/, "")); last = null; continue;

let openNote = null, delNote = null;   // "<where>:<taskId>" of the note box that's open; note id waiting for a second tap

  // Still waiting for someone else's task? Ask first, so nothing gets ticked by mistake.

  doneAnyway = null;
  openNote = "any:" + t.id;

}

  if (freed.length) { const x = freed[0], who = ownerName(x);
    return `Done! ${who === "nobody yet" ? "The next task" : who === "you" ? "You" : cap(who)} can start “${x.text}” now` + (freed.length > 1 ? ` (and ${freed.length - 1} more)` : "") }

}

   Loaded separately, only when someone opens it, so the rest of the site never depends on it.
   It only ever suggests: people review and tap to add or save anything. */

const AI_SDK = "https://www.gstatic.com/firebasejs/12.19.0/";
// Current Gemini models on the free Gemini Developer API, best first; older ones are backups. Google retires models
// over time, so the site also remembers which one worked last and tries that first.
const AI_MODELS = ["gemini-3.8-flash", "gemini-3.5-flash-lite", "gemini-3.1-flash-lite", "gemini-2.5-flash-lite", "gemini-2.5-flash"];
let asstOpen = false, asstBusy = false, asstMsgs = [], aiP = null, checkinDraft = null;

function loadAI() {
  if (!aiP) aiP = (async () => {
    const [appM, aiM] = await Promise.all([import(AI_SDK + "firebase-app.js"), import(AI_SDK + "firebase-ai.js")]);
    const app = appM.getApps().find(a => a.name === "assistant") || appM.initializeApp(firebaseConfig, "assistant");
    return { aiM, ai: aiM.getAI(app, { backend: new aiM.GoogleAIBackend() }) };
  })().catch(e => { aiP = null; throw e });
  return aiP;
}
async function askAI(prompt, system) {
  const { aiM, ai } = await loadAI();
