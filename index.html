<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Office Pitch Room</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4656D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}

/* Layout: compact top bar, bottom tab bar on phones (top on wide screens), one calm column of cards */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --ink:#1F2631; --muted:#677284; --line:#E2E7ED; --hero:#E8EBFD;
  --accent:#4656D6; --accent-soft:#ECEFFE; --on-accent:#FFFFFF; --keep:#1D7F52; --keep-soft:#DDF2E7; --drop:#B83A26; --drop-soft:#F8E1DC; --warn:#A35F00; --warn-soft:#FBEBD2;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14181D; --surface:#1C2128; --ink:#E3E7ED; --muted:#98A2AF; --line:#2A3039; --hero:#242A45;
  --accent:#97A3FF; --accent-soft:#272D4C; --on-accent:#10142B; --keep:#5BC892; --keep-soft:#14301F; --drop:#F08872; --drop-soft:#3A1C16; --warn:#F0B35A; --warn-soft:#3A2A10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181D; --surface:#1C2128; --ink:#E3E7ED; --muted:#98A2AF; --line:#2A3039; --hero:#242A45;
  --accent:#97A3FF; --accent-soft:#272D4C; --on-accent:#10142B; --keep:#5BC892; --keep-soft:#14301F; --drop:#F08872; --drop-soft:#3A1C16; --warn:#F0B35A; --warn-soft:#3A2A10; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.02em}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:600}
.lede{color:var(--muted);margin:6px 0 0;max-width:60ch}
.label{font:500 12.5px/1.3 var(--body);color:var(--muted)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 10px;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.brand{background:none;border:0;padding:0;font:800 21px/1 var(--display);letter-spacing:-.02em;color:var(--ink)}
.me-btn{border:0;background:none;padding:0;border-radius:50%}
.me-btn .av{width:34px;height:34px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.status{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.warn{color:var(--drop)}

/* main navigation: bottom bar on phones, a row under the top bar on wide screens */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tab{position:relative;background:none;border:0;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] .ico{background:var(--accent-soft)}
.ico{display:grid;place-items:center;width:48px;height:28px;border-radius:999px;transition:background .15s}
.count{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;box-sizing:border-box;padding:0 5px;border-radius:999px;background:var(--drop);color:#fff;font:600 11px/18px var(--body);text-align:center}
#c-ideas,#c-projects{background:var(--muted)}
@media (min-width:760px){
  .nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);bottom:auto;z-index:14;display:flex;gap:4px;border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:18px}
  .tab{flex-direction:row;gap:8px;font-size:14px;padding:6px 14px 6px 6px}
  .ico{width:34px}
  .count{position:static;margin-left:2px}
  .wrap{padding-bottom:64px}
}

/* compose */
.compose{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.compose input,.compose textarea,.addstep input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.compose textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 15px;font-weight:600;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.list{display:grid;gap:12px;margin-top:18px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.idea p{margin:0;color:var(--muted);overflow-wrap:anywhere}
.by{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.av{width:24px;height:24px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--surface)}
.stack{display:flex}.stack .av{margin-left:-7px}.stack .av:first-child{margin-left:0}

.vote{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.v{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 10px;font-weight:600;font-size:14px}
.v b{font:500 13px/1 var(--body)}
.v.keep[aria-pressed="true"]{background:var(--keep-soft);border-color:var(--keep);color:var(--keep)}
.v.drop[aria-pressed="true"]{background:var(--drop-soft);border-color:var(--drop);color:var(--drop)}
.verdict{font-size:13px;font-weight:600}
.verdict.keep{color:var(--keep)}.verdict.drop{color:var(--drop)}

details.removed{margin-top:22px;color:var(--muted)}
details.removed summary{cursor:pointer;font-weight:600}
details.removed .idea{opacity:.75}

.empty{border:1px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted);background:color-mix(in srgb,var(--surface) 50%,transparent)}

/* progress line */
.track{position:relative;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px;transition:width .4s ease}
.track .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.pmeta{display:flex;justify-content:space-between;font:500 12px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}

/* focus */
.focus{background:var(--hero);color:var(--ink);border-radius:18px;padding:22px;display:grid;gap:12px;margin-bottom:18px}
.focus .label{color:inherit;opacity:.7}
.focus h2{font-size:clamp(24px,5vw,32px)}
.focus .track{height:12px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.focus .track .tick{background:var(--hero)}
.focus .pmeta{color:inherit;opacity:.8}
.focus .btn:not(.quiet){color:var(--ink)}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:5px 0;min-width:0}
.steps input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.steps label{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.steps li.done label{color:var(--muted);text-decoration:line-through}
.steps .x{opacity:0;border:0;background:none;color:var(--muted);padding:0 4px}
.steps li:hover .x,.steps .x:focus-visible{opacity:1}
.addstep{display:flex;gap:8px}
.addstep input{flex:1;min-width:0}
.members{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));align-items:start}
.member.me{border-color:var(--accent)}
.empty h3{color:var(--ink)}
.gate{max-width:420px;margin:12vh auto 0;display:grid;gap:14px;text-align:center;justify-items:center}
.gate p{color:var(--muted);margin:0}
.me-chip{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.tabs{overflow-x:auto;scrollbar-width:none}
.tab{white-space:nowrap}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:0;margin-bottom:12px}
.chip{font:500 11px/1 var(--body);letter-spacing:.04em;padding:5px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.mini{font:500 12px/1.2 var(--body);color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;max-width:100%;min-width:0}
.phase{display:grid;gap:4px;margin-top:6px}
.phase-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.phase-h h3{font-size:17px}
.phase-n{font:500 12px/1 var(--body);color:var(--muted)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.task input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.task .ttext{overflow-wrap:anywhere;cursor:pointer}
.task.done .ttext{color:var(--muted);text-decoration:line-through}
.task .meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.task .x{border:0;background:none;color:var(--muted);padding:0 4px}
.addtask{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.addtask input{flex:1 1 180px;min-width:0;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px}
.phasebar{display:flex;gap:6px;flex-wrap:wrap}
.ph{font:500 11px/1 var(--body);padding:5px 8px;border-radius:6px;border:1px solid var(--line)}
.ph.complete{background:var(--keep-soft);border-color:var(--keep);color:var(--keep)}
.focus .ph{border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.suggest{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px;display:grid;gap:10px}
.sg-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:14px;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.sg-row .why{grid-column:1/3;font-size:12px;color:var(--muted)}
.sg-who{display:flex;gap:6px;align-items:center;font-weight:600}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:13px 14px;font-weight:500}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.qprog{display:flex;justify-content:space-between;font:500 12px/1 var(--body);color:var(--muted)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:92px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:8px}
.bar .pct{font:500 12px/1 var(--body);text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar.top{font-weight:600}
.role{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1}
.catbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.catbar:empty{display:none}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.catchip{font:500 11px/1 var(--body);padding:5px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.notes{grid-column:2/4;display:grid;gap:6px;justify-items:start}
.note{display:flex;gap:8px;align-items:flex-start;font-size:14px;background:var(--bg);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box}
.note-body{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.note-meta{font-size:12px;color:var(--muted)}
.noteedit{display:grid;gap:6px;width:100%}
.noteinput,#chat-input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;resize:vertical;font:inherit;color:inherit}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.steps .notes .x,.note .x{opacity:1}
/* In each person's list, notes sit under the task instead of beside it */
.steps .notes{grid-column:auto;width:100%}
.steps li{padding:8px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps label{line-height:1.45}
.chatbox{display:grid;gap:10px}
.chatlog{height:clamp(300px,calc(100dvh - 290px),640px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;font:500 11px/1 var(--body);color:var(--muted);margin:12px 0 6px}
.msg-name{font-size:12px;color:var(--muted);margin:8px 0 2px 32px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:85%}
.msg.mine{align-self:flex-end}
.msg .av{margin:0}
.av-space{width:22px;flex:none}
.bubble{background:var(--bg);border-radius:14px;padding:7px 11px;overflow-wrap:anywhere;white-space:pre-wrap;min-width:0}
.msg.mine .bubble{background:var(--accent);color:var(--on-accent)}
.msg-time{font:500 10px/1 var(--body);opacity:.6;margin-left:8px;white-space:nowrap}
.bubble{cursor:pointer;display:grid;gap:4px}
.bubble>span:not(.msg-time){display:inline}
.msg.selected .bubble{outline:2px solid var(--accent);outline-offset:2px}
.msg.flash .bubble{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:none}}
.quote{display:grid;gap:1px;text-align:left;border:0;border-left:3px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 8px;font-size:13px;max-width:100%;overflow-wrap:anywhere;white-space:normal;cursor:pointer}
.quote span{color:var(--muted)}
.msg.mine .quote{background:color-mix(in srgb,var(--on-accent) 14%,transparent);border-left-color:var(--on-accent);color:var(--on-accent)}
.msg.mine .quote span{color:inherit;opacity:.85}
.msg-actions{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px 30px}
.msg-actions.mine{justify-content:flex-end;margin-left:0}
.act{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.act.danger{color:var(--drop);border-color:var(--drop)}
.act.quiet{color:var(--muted)}
.chat-context{display:flex;gap:10px;align-items:center;border-left:3px solid var(--accent);background:var(--surface);border-radius:8px;padding:8px 10px}
.ctx-title{font-size:12px;font-weight:600;color:var(--accent)}
.ctx-text{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-context .x{border:0;background:none;color:var(--muted);font-size:16px;padding:4px}
@media (prefers-reduced-motion:reduce){.msg.flash .bubble{animation:none}}
.chatform{display:flex;gap:8px;align-items:flex-end}
#chat-input{resize:none;max-height:140px}
.attach{flex:none;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--muted)}
.attach:hover{color:var(--accent);border-color:var(--accent)}
.attach-list{display:flex;gap:8px;flex-wrap:wrap}
.att-chip{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px 5px 5px;max-width:100%;min-width:0;font-size:13px}
.att-chip img{width:34px;height:34px;object-fit:cover;border-radius:5px;flex:none}
.att-chip-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.att-chip .x{border:0;background:none;color:var(--muted)}
.upload-status{font-size:13px;color:var(--accent);font-weight:600}
.chatbox.dropping .chatlog{outline:2px dashed var(--accent);outline-offset:-6px}
.att-img{border:0;padding:0;background:none;border-radius:10px;overflow:hidden;display:block;max-width:min(260px,100%);cursor:zoom-in}
.att-img img{display:block;width:100%;height:auto;max-height:320px;object-fit:cover}
.att-file{display:flex;gap:10px;align-items:center;background:var(--surface);color:var(--ink);border-radius:10px;padding:8px;min-width:0;max-width:280px}
.att-ext{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:600 10px/1 var(--body)}
.att-info{flex:1;min-width:0}
.att-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-size{font:500 11px/1.4 var(--body);color:var(--muted)}
.att-file .act{flex:none}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(10,14,18,.86);display:grid;grid-template-rows:auto 1fr;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:10px}
.lb-bar{display:flex;gap:8px;align-items:center;color:#fff}
.lb-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lb-body{display:grid;place-items:center;min-height:0;color:#fff}
.lb-body img,.lb-body video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.phase-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.linkbtn.danger{color:var(--drop)}
.addphase{border-style:dashed}
.planner{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 8px 3px 3px;color:var(--ink)}
.planner .x{border:0;background:none;color:var(--muted);padding:0 2px}
.task.mytask{background:linear-gradient(90deg,var(--accent-soft),transparent 60%)}
.task input[type=checkbox]:disabled{opacity:.5;cursor:not-allowed}
.prio{font:500 11px/1 var(--body);padding:5px 8px;border-radius:6px;white-space:nowrap;border:1px solid currentColor}
.prio-urgent{color:var(--drop);background:var(--drop-soft)}
.prio-high{color:var(--warn);background:var(--warn-soft)}
.prio-medium{color:var(--accent);background:var(--accent-soft)}
.prio-low{color:var(--muted);background:transparent}
.focus .prio{background:transparent;color:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.due{font:500 11px/1 var(--body);color:var(--muted)}
.due.late{color:var(--drop)}
.due.soon{color:var(--warn)}
.notegrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));align-items:start}
.pnote{min-height:140px;background:var(--surface);border-color:transparent;padding:4px 2px;font-size:15px;line-height:1.5}
.pnote:focus{outline:none}
.profile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--hero);border-radius:20px;padding:20px}
.av-lg{width:64px;height:64px;border:3px solid var(--surface)}
.hello{color:var(--muted);font-size:14px}
.profile h1{font-size:clamp(26px,7vw,34px);letter-spacing:-.02em}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:10px 12px;display:grid;gap:0}
.stat b{font:800 22px/1.2 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.late b{color:var(--drop)}
.nowcard{display:grid;gap:2px;width:100%;text-align:left;margin-top:12px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;color:var(--ink)}
.nowcard:hover{border-color:var(--accent)}
.now-label{font-size:12.5px;color:var(--muted)}
.now-title{font:700 18px/1.25 var(--display)}
.now-sub{font-size:13.5px;color:var(--accent);font-weight:600}
.notice{margin-top:12px;border-radius:14px;padding:12px 14px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:500}
.seg-wide{display:flex;width:100%;box-sizing:border-box}
.seg-wide button{flex:1;padding:9px 12px;font-size:14px}
.me-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.me-email{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative;border:0;background:none;color:var(--ink);width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.bell:hover{background:var(--surface)}
.bell .count{top:2px;left:auto;right:0}
.alerts{position:fixed;z-index:25;top:calc(env(safe-area-inset-top,0px) + 58px);right:max(12px,env(safe-area-inset-right,0px));width:min(380px,calc(100vw - 24px));max-height:min(70vh,560px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(15,20,35,.18);padding:10px;box-sizing:border-box;display:grid;gap:2px;align-content:start}
.alerts .x{border:0;background:none;color:var(--muted);font-size:16px;padding:4px 6px}
.alert{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:0;background:none;border-radius:12px;padding:10px;color:var(--ink);font-size:14px}
.alert:hover{background:var(--bg)}
.alert.new{background:var(--accent-soft)}
.alert .av{width:30px;height:30px}
.alert-dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);font-weight:800}
.alert-body{display:grid;gap:2px;min-width:0;overflow-wrap:anywhere}
.alert-time{font-size:12px;color:var(--muted)}
.alert-tip{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:6px}
.alert-empty{color:var(--muted);font-size:14px;padding:6px 10px 10px;margin:0}
.buildcard{text-align:left;width:100%;color:var(--ink);font:inherit;cursor:pointer}
.buildcard:hover{border-color:var(--accent)}
.done-badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--keep);background:var(--keep-soft);border-radius:999px;padding:4px 10px}
.done-card h3{font-size:19px}
.confetti{position:fixed;inset:0;z-index:60;pointer-events:none}
.pill{font:500 11px/1 var(--body);padding:5px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);box-sizing:border-box;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){.track .fill{transition:none}}

const tally = i => { let k = 0, d = 0; for (const v of Object.values(i.votes || {})) { if (v === "keep") k++; else if (v === "drop") d++ } return { k, d } };
const voters = (i, kind) => Object.entries(i.votes || {}).filter(([, v]) => v === kind).map(([u]) => u);

function tasksOf(p) {
  const out = [];
  for (const [field, phaseDefault] of [["tasks", "build"], ["steps", "build"]]) {
    for (const [id, t] of Object.entries(p[field] || {})) if (t && t.text) out.push({ id, field, ...t, phase: t.phase || phaseDefault, path: `${field}.${id}` });
  }
  return out.sort((a, b) => (a.order || 0) - (b.order || 0));
}
const progressOf = list => { const d = list.filter(t => t.done).length; return { total: list.length, done: d, pct: pctOf(d, list.length) } };
const teamIds = () => Object.keys(people).sort((a, b) => a === me ? -1 : b === me ? 1 : name(a).localeCompare(name(b)));
const topSkills = id => { const s = (people[id] || {}).skills; if (!s) return []; return SKILL_IDS.slice().sort((a, b) => (s[b] || 0) - (s[a] || 0)).slice(0, 2) };

/* ---------- smart helper: who should do what ---------- */

function suggest(p) {
  const tasks = tasksOf(p);
  const open = tasks.filter(t => !t.done && !t.owner);
  const joined = Object.entries(p.members || {}).filter(([, v]) => v).map(([u]) => u);
  const pool = joined.length >= 2 ? joined : teamIds();
  if (!pool.length) return [];
  const load = Object.fromEntries(pool.map(u => [u, tasks.filter(t => !t.done && t.owner === u).length]));
  const out = [];
  for (const t of open) {
    let best = null;
    for (const u of pool) {
      const prof = people[u] || {};
      const sk = prof.skills ? (prof.skills[t.skill] ?? 0) : 0.35;
      const grow = (prof.grow || []).includes(t.skill) ? 0.12 : 0;
      const score = sk + grow - 0.12 * load[u];
      if (!best || score > best.score) best = { u, score, sk, grow, hasQuiz: !!prof.skills };
    }
    load[best.u]++;
    const skillName = t.skill ? SKILLS[t.skill].name.toLowerCase() : "general";
    let why;
    if (!t.skill) why = `Spreads the work evenly`;
    else if (!best.hasQuiz) why = `Hasn't taken the skills quiz yet, so picked to spread the work`;
    else if (best.grow && best.sk < 0.5) why = `Wants to get better at ${skillName} work`;
    else why = `${SKILLS[t.skill].name} score ${Math.round(best.sk * 100)}%` + (best.grow ? `, and wants to grow in it` : "");
    out.push({ task: t, owner: best.u, why });
  }
  return out;
}

let chat = [];

let chatEdit = null;     // own message being edited
let chatDel = null;      // own message waiting for delete confirmation
const seenKey = () => "chatSeen:" + me;

$("#chatform").addEventListener("submit", e => { e.preventDefault(); sendChat() });

function cancelChatMode() {

}
let sending = false;
async function sendChat() {

  const inp = $("#chat-input"); const text = inp.value.trim();
  if (chatEdit) {
    if (!text) return;
    inp.value = "";
    const id = chatEdit; chatEdit = null;

        const file = await uploadFile(await prepareFile(files[i].f), pct => setUploadStatus(`Sending ${files[i].f.name}\u2026 ${pct}%`));
        const data = { by: me, text: "", at: Date.now(), file };

    }

  }
  if (text) {
    const data = { by: me, text, at: Date.now() };
    if (replyTo) data.replyTo = replyTo;

/* ----- chat attachments (stored in the database in pieces, since free Firebase has no file storage) ----- */

const MAX_FILE = 5 * 1024 * 1024;     // 5 MB per file
const MAX_IMAGE_IN = 30 * 1024 * 1024;// photos bigger than 5 MB are shrunk first
const PART = 900 * 1024;              // one database document holds under 1 MB
let pending = [];                     // files waiting to be sent: {f, key, url}

const fmtSize = n => n < 1024 ? n + " B" : n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB";
const extOf = name => ((name || "").split(".").pop() || "file").slice(0, 4).toUpperCase();
function msgSummary(m) {
  if (m.text) return snippet(m.text);
  if (m.file) return m.file.thumb ? "Photo" : "File: " + m.file.name;
  return "";
}

$("#chat-attach").onclick = () => $("#chat-file").click();
$("#chat-file").onchange = e => { addFiles([...e.target.files]); e.target.value = "" };
$("#chat-input").addEventListener("paste", e => { const fs = [...((e.clipboardData && e.clipboardData.files) || [])]; if (fs.length) { e.preventDefault(); addFiles(fs) } });
const chatboxEl = document.querySelector(".chatbox");
chatboxEl.addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); chatboxEl.classList.add("dropping") } });
chatboxEl.addEventListener("dragleave", e => { if (!chatboxEl.contains(e.relatedTarget)) chatboxEl.classList.remove("dropping") });
chatboxEl.addEventListener("drop", e => { e.preventDefault(); chatboxEl.classList.remove("dropping"); addFiles([...e.dataTransfer.files]) });

function addFiles(fs) {
  for (const f of fs) {
    const isImg = /^image\/(jpeg|png|webp|heic|heif|bmp)$/.test(f.type);
    if (f.size > (isImg ? MAX_IMAGE_IN : MAX_FILE)) { toast(`${f.name} is too big. The limit is 5 MB per file.`); continue }
    pending.push({ f, key: uid(), url: f.type.startsWith("image/") ? URL.createObjectURL(f) : null });
  }
  renderAttach(); $("#chat-input").focus();
}
function renderAttach() {
  const box = $("#attach-list"); box.replaceChildren(); box.hidden = !pending.length;
  for (const p of pending) box.append(el("div", { class: "att-chip" },
    p.url ? el("img", { src: p.url, alt: "" }) : el("span", { class: "att-ext" }, extOf(p.f.name)),
    el("span", { class: "att-chip-name" }, p.f.name), el("span", { class: "att-size" }, fmtSize(p.f.size)),
    el("button", { type: "button", class: "x", "aria-label": "Remove " + p.f.name, onclick: () => { if (p.url) URL.revokeObjectURL(p.url); pending = pending.filter(x => x !== p); renderAttach() } }, "\u2715")));
}
function setUploadStatus(t) { const n = $("#upload-status"); n.textContent = t; n.hidden = !t }

function canvasJpeg(img, max, q) {
  const r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res({ blob: b, w: c.width, h: c.height, canvas: c }), "image/jpeg", q));
}
async function prepareFile(f) {
  const out = { blob: f, name: f.name || "file", type: f.type || "application/octet-stream" };
  if (f.type.startsWith("image/") && f.type !== "image/svg+xml") {
    try {
      const img = await createImageBitmap(f);
      out.w = img.width; out.h = img.height;
      const keepOriginal = f.size <= PART && /^image\/(jpeg|png|webp|gif)$/.test(f.type);
      if (!keepOriginal && f.type !== "image/gif") {
        const big = await canvasJpeg(img, 1600, 0.82);
        out.blob = big.blob; out.type = "image/jpeg"; out.name = out.name.replace(/\.[^.]+$/, "") + ".jpg"; out.w = big.w; out.h = big.h;
      }
      const small = await canvasJpeg(img, 480, 0.6);

    } catch { /* not a picture the browser can read: send it as a normal file */ }
  }

}
async function uploadFile(p, onProgress) {
  const id = uid(); const buf = new Uint8Array(await p.blob.arrayBuffer());
  const parts = Math.max(1, Math.ceil(buf.length / PART));
  for (let n = 0; n < parts; n++) {
    await setDoc(doc(db, "fileparts", `${id}_${n}`), { by: me, fileId: id, n, data: Bytes.fromUint8Array(buf.subarray(n * PART, (n + 1) * PART)) });
    onProgress && onProgress(Math.round((n + 1) / parts * 100));
  }
  const file = { id, name: p.name, type: p.type, size: buf.length, parts };
  if (p.thumb) { file.thumb = p.thumb; file.w = p.w; file.h = p.h }

}
const fileCache = {};
function loadFile(f) {

    const snaps = await Promise.all(Array.from({ length: f.parts }, (_, n) => getDoc(doc(db, "fileparts", `${f.id}_${n}`))));
    if (snaps.some(s => !s.exists())) throw new Error("missing");
    return URL.createObjectURL(new Blob(snaps.map(s => s.data().data.toUint8Array()), { type: f.type }));
  })().catch(e => { delete fileCache[f.id]; throw e });

}
async function downloadFile(f) {

}

}
const playable = f => /^(video|audio)\//.test(f.type);
function attachmentEl(f) {

async function openViewer(f) {

  const body = el("div", { class: "lb-body" }, f.thumb ? el("img", { src: f.thumb, alt: f.name }) : el("p", {}, "Loading\u2026"));

/* ----- project priority ----- */

const PRIORITIES = [
  { id: "urgent", name: "Urgent" },
  { id: "high", name: "High" },
  { id: "medium", name: "Medium" },
  { id: "low", name: "Low" },
];
const prioOf = p => PRIORITIES.find(x => x.id === p.priority) || PRIORITIES[2];
const prioRank = p => PRIORITIES.indexOf(prioOf(p));
const prioChip = p => el("span", { class: "prio prio-" + prioOf(p).id }, prioOf(p).name + " priority");
function prioControl(p) {
  if (!canPlan(p)) return el("div", { class: "row", style: "gap:8px;font-size:13px;color:var(--muted)" }, "Priority", prioChip(p));
  const sel = el("select", { class: "mini", "aria-label": "Priority", onchange: e => write(() => upd(p.id, { priority: e.target.value }), "Priority changed") },
    PRIORITIES.map(x => el("option", { value: x.id }, x.name)));
  sel.value = prioOf(p).id;
  return el("label", { class: "row", style: "gap:8px;font-size:13px;color:var(--muted)" }, "Priority", sel);
}

/* ----- my tasks ----- */

let mineShow = "todo";
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` };
let personal = [];
function myTasks() {
  const out = personal.map(t => ({ t, phase: "", personal: true, p: { id: "__personal", title: "Just for me", priority: t.priority || "medium" } }));
  for (const p of ideas.filter(i => i.status === "approved" || i.status === "completed")) {
    const phases = getPhases(p);
    for (const t of tasksOf(p)) if (t.owner === me) out.push({ p, t, closed: p.status === "completed", phase: (phases.find(ph => ph.id === t.phase) || {}).name || "" });
  }
  return out;
}
function renderMine(box) {
  const all = myTasks();
  // A task you just ticked stays in "To do" until you save or skip its note.
  const noting = x => openNote && openNote.endsWith(":" + x.t.id);
  const todo = all.filter(x => !x.closed && (!x.t.done || noting(x))), done = all.filter(x => x.t.done);
  const today = todayStr();
  const overdue = todo.filter(x => !x.t.done && x.t.due && x.t.due < today).length;

  box.append(el("div", { class: "row", style: "margin-bottom:12px" },
    el("div", {}, el("p", { style: "margin:0;color:var(--muted);font-size:14px" },
      all.length ? `${todo.filter(x => !x.t.done).length} to do${overdue ? ` · ${overdue} overdue` : ""} · ${done.length} done` : "Everything assigned to you, across every project.")),
    el("span", { class: "spacer" }),
    el("div", { class: "seg", role: "group", "aria-label": "Show" },
      el("button", { "aria-pressed": String(mineShow === "todo"), onclick: () => { mineShow = "todo"; render() } }, `To do ${todo.filter(x => !x.t.done).length}`),
      el("button", { "aria-pressed": String(mineShow === "done"), onclick: () => { mineShow = "done"; render() } }, `Done ${done.length}`))));

  box.append(addPersonalTaskRow());
  if (!all.length) { box.append(el("div", { class: "empty" }, "No tasks yet. Add one for yourself above. When a planner gives you a task in a project, it shows up here too.")); return }

  if (mineShow === "done") {
    if (!done.length) { box.append(el("div", { class: "empty" }, "Nothing finished yet.")); return }
    const list = el("div", { class: "idea", style: "gap:0" });
    done.sort((a, b) => (b.t.doneAt || 0) - (a.t.doneAt || 0)).forEach(x => list.append(myTaskRow(x)));
    box.append(list); return;
  }
  if (!todo.length) { box.append(el("div", { class: "empty" }, "All done. Nice work.")); return }

  // Highest priority project first, then the soonest due date.
  todo.sort((a, b) => prioRank(a.p) - prioRank(b.p) || ((a.t.due || "9999") < (b.t.due || "9999") ? -1 : (a.t.due || "9999") > (b.t.due || "9999") ? 1 : 0) || (isActive(a.p) ? -1 : isActive(b.p) ? 1 : 0) || (a.t.order || 0) - (b.t.order || 0));
  for (const pr of PRIORITIES) {
    const group = todo.filter(x => prioOf(x.p).id === pr.id); if (!group.length) continue;
    const sec = el("section", { class: "idea", style: "gap:0;margin-bottom:12px" },
      el("div", { class: "row", style: "margin-bottom:4px" }, el("span", { class: "prio prio-" + pr.id }, pr.name + " priority"), el("span", { class: "spacer" }), el("span", { class: "label" }, group.length + (group.length > 1 ? " tasks" : " task"))));
    group.forEach(x => sec.append(myTaskRow(x)));
    box.append(sec);
  }
}
function addPersonalTaskRow() {
  const inp = el("input", { id: "ptask-text", placeholder: "Add a task just for yourself", maxlength: "200" });
  const due = el("input", { type: "date", class: "mini", id: "ptask-due", "aria-label": "Due date" });
  const pri = el("select", { class: "mini", id: "ptask-prio", "aria-label": "Priority" }, PRIORITIES.map(x => el("option", { value: x.id }, x.name + " priority")));
  pri.value = "medium";
  const add = () => {
    const text = inp.value.trim(); if (!text) return;
    const data = { text, done: false, due: due.value || null, priority: pri.value, order: Date.now() };
    inp.value = ""; due.value = "";
    write(() => setDoc(doc(db, "private", me, "tasks", uid()), data), "Task added");
  };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); add() } });
  return el("div", { class: "idea", style: "gap:8px;margin-bottom:12px" },
    el("div", { class: "addtask", style: "margin:0" }, inp, el("button", { class: "btn primary", onclick: add }, "Add")),
    el("div", { class: "row", style: "gap:8px;font-size:13px;color:var(--muted)" }, pri, el("label", { class: "row", style: "gap:6px" }, "Due", due),
      el("span", { class: "spacer" }), el("span", {}, "Only you can see these")));
}
function myTaskRow(x) {
  if (x.personal) return personalTaskRow(x.t);
  const { p, t, phase } = x;
  const cid = "my-" + t.id, today = todayStr();
  const late = !t.done && t.due && t.due < today, soon = !t.done && t.due === today;
  return el("div", { class: "task" + (t.done ? " done" : "") },
    el("input", { type: "checkbox", id: cid, checked: t.done, onchange: e => toggleDone(p, t, e.target.checked) }),
    el("label", { for: cid, class: "ttext" }, t.text),
    el("span"),
    el("div", { class: "meta" },
      el("button", { class: "linkbtn", onclick: () => { location.hash = "plan-" + p.id } }, p.title),
      phase ? el("span", { class: "label" }, phase) : null,
      isActive(p) ? el("span", { class: "pill" }, "Building") : null,
      t.due ? el("span", { class: "due" + (late ? " late" : soon ? " soon" : "") }, late ? "Overdue · " + fmtDate(t.due) : soon ? "Due today" : "Due " + fmtDate(t.due)) : null),
    notesBlock(p, t, "mine"));
}

function personalTaskRow(t) {
  const cid = "myp-" + t.id, today = todayStr();
  const late = !t.done && t.due && t.due < today, soon = !t.done && t.due === today;
  const ref = doc(db, "private", me, "tasks", t.id);
  return el("div", { class: "task" + (t.done ? " done" : "") },
    el("input", { type: "checkbox", id: cid, checked: !!t.done, onchange: e => write(() => setDoc(ref, { done: e.target.checked, doneAt: e.target.checked ? Date.now() : null }, { merge: true }), e.target.checked ? "Done" : null) }),
    el("label", { for: cid, class: "ttext" }, t.text),
    el("button", { class: "x", title: "Delete task", "aria-label": "Delete task " + t.text, onclick: () => write(() => deleteDoc(ref), "Task deleted") }, "\u2715"),
    el("div", { class: "meta" },
      el("span", { class: "label" }, "Just for me"),
      t.due ? el("span", { class: "due" + (late ? " late" : soon ? " soon" : "") }, late ? "Overdue \u00b7 " + fmtDate(t.due) : soon ? "Due today" : "Due " + fmtDate(t.due)) : null));
}

/* ----- private notes (only the person who wrote them can read them) ----- */

let myNotes = [];
const noteTimers = {};
function newPrivateNote() {
  const id = uid();
  myNotes.unshift({ id, text: "", at: Date.now() });
  render();
  setTimeout(() => { const n = document.getElementById("pn-" + id); if (n) n.focus() }, 0);
  write(() => setDoc(doc(db, "private", me, "notes", id), { text: "", at: Date.now() }));
}
function savePrivateNote(id, text) {
  clearTimeout(noteTimers[id]);
  const mark = document.getElementById("pns-" + id); if (mark) mark.textContent = "Saving…";
  noteTimers[id] = setTimeout(async () => {
    try { await fbReady; await setDoc(doc(db, "private", me, "notes", id), { text, at: Date.now() }, { merge: true }); const m = document.getElementById("pns-" + id); if (m) m.textContent = "Saved" }
    catch (e) { const m = document.getElementById("pns-" + id); if (m) m.textContent = e.code === "permission-denied" ? "Not saved: ask Mohammed to update the database rules" : "Not saved: check your connection" }
  }, 700);
}
let delNoteId = null;
function renderNotes(box) {
  box.append(el("div", { class: "row", style: "margin-bottom:12px" },
    el("div", {}, el("p", { style: "margin:0;color:var(--muted);font-size:14px" }, "Only you can see these. Not your friends, not the admin.")),
    el("span", { class: "spacer" }), el("button", { class: "btn primary", onclick: newPrivateNote }, "New note")));
  if (!myNotes.length) { box.append(el("div", { class: "empty" }, "No notes yet. Use this for ideas, reminders, to-dos, anything just for you.")); return }
  const grid = el("div", { class: "notegrid" });
  for (const n of myNotes) {
    const ta = el("textarea", { id: "pn-" + n.id, class: "noteinput pnote", maxlength: "20000", rows: "6", placeholder: "Write anything…", oninput: e => savePrivateNote(n.id, e.target.value) });
    ta.value = n.text || "";
    grid.append(el("article", { class: "idea", style: "gap:8px" }, ta,
      el("div", { class: "row", style: "gap:8px;font-size:12px;color:var(--muted)" },
        el("span", { id: "pns-" + n.id }, "Edited " + ago(n.at)), el("span", { class: "spacer" }),
        delNoteId === n.id
          ? el("button", { class: "linkbtn danger", onclick: () => { delNoteId = null; clearTimeout(noteTimers[n.id]); write(() => deleteDoc(doc(db, "private", me, "notes", n.id)), "Note deleted") } }, "Tap again to delete")
          : el("button", { class: "linkbtn danger", onclick: () => { delNoteId = n.id; render() } }, "Delete"))));
  }
  box.append(grid);
}

/* ----- alerts ----- */

const seenAlertsKey = () => "alertsSeen:" + me;
const getAlertsSeen = () => { try { return +localStorage.getItem(seenAlertsKey()) || 0 } catch { return 0 } };
let alertsOpen = false, alertBaseline = null;
const pageOpenedAt = Date.now();
const dayStart = (offset = 0) => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime() + offset * 864e5 };
function buildAlerts() {
  const out = [], today = todayStr();
  const tomorrow = (() => { const d = new Date(dayStart(1)); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` })();
  const add = (key, at, who, text, go) => { if (at) out.push({ key, at, who, text, go }) };
  for (const p of ideas) {
    if (p.status === "voting" && p.author !== me) add("idea:" + p.id, p.createdAt, p.author, `${name(p.author)} pitched a new idea: ${p.title}`, "ideas");
    if (p.status === "completed" && p.completedBy !== me) add("done:" + p.id, p.completedAt, p.completedBy, `${p.title} is completed`, "projects-done");
    const pl = (p.planners || {})[me];
    if (pl && typeof pl === "object" && pl.by !== me) add("planner:" + p.id, pl.at, pl.by, `${name(pl.by)} made you a planner of ${p.title}`, "plan-" + p.id);
    if (p.status !== "approved") continue;
    for (const t of tasksOf(p)) {
      if (t.owner !== me) continue;
      if (t.assignedBy && t.assignedBy !== me) add("task:" + t.id + ":" + t.assignedAt, t.assignedAt, t.assignedBy, `${name(t.assignedBy)} gave you a task: ${t.text} (${p.title})`, "me");
      for (const [nid, n] of Object.entries(t.notes || {})) if (n && n.by !== me) add("note:" + nid, n.at, n.by, `${name(n.by)} left a note on your task: ${t.text}`, "plan-" + p.id);
      if (!t.done && t.due && t.due <= tomorrow) add("due:" + t.id + ":" + today, dayStart(), null, t.due < today ? `Overdue: ${t.text} (${p.title})` : t.due === today ? `Due today: ${t.text} (${p.title})` : `Due tomorrow: ${t.text} (${p.title})`, "me");
    }
  }
  for (const t of personal) if (!t.done && t.due && t.due <= tomorrow) add("due:" + t.id + ":" + today, dayStart(), null, t.due < today ? `Overdue: ${t.text}` : t.due === today ? `Due today: ${t.text}` : `Due tomorrow: ${t.text}`, "me");
  for (const [pid, a] of Object.entries(activeMap)) { const p = ideas.find(i => i.id === pid); if (p && a && a.by !== me && p.status === "approved") add("start:" + pid + ":" + a.at, a.at, a.by, `We started building ${p.title}`, "build-" + pid) }
  for (const m of chat) { if (m.by === me || !m.replyTo) continue; const o = chat.find(x => x.id === m.replyTo); if (o && o.by === me) add("reply:" + m.id, m.at, m.by, `${name(m.by)} replied to you: ${msgSummary(m)}`, "chat") }
  return out.sort((a, b) => b.at - a.at).slice(0, 50);
}
function renderAlerts() {
  const list = buildAlerts(), seen = getAlertsSeen();
  const unread = list.filter(a => a.at > seen).length;
  const c = $("#c-alerts"); c.hidden = !unread; c.textContent = unread > 9 ? "9+" : unread;
  notifyDevice(list);
  const panel = $("#alerts"); panel.hidden = !alertsOpen;
  if (!alertsOpen) return;
  panel.replaceChildren();
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  panel.append(el("div", { class: "row", style: "padding:4px 4px 8px" }, el("h3", {}, "Alerts"), el("span", { class: "spacer" }),
    el("button", { class: "x", "aria-label": "Close alerts", onclick: () => { alertsOpen = false; render() } }, "\u2715")));
  if (perm === "default") panel.append(el("div", { class: "alert-tip" }, el("span", {}, "Get these as pop-ups on this phone or computer while the site is open."),
    el("button", { class: "btn primary", onclick: enableDeviceAlerts }, "Turn on")));
  if (!list.length) panel.append(el("p", { class: "alert-empty" }, "Nothing yet. You'll see new tasks, notes, replies and deadlines here."));
  for (const a of list) panel.append(el("button", { class: "alert" + (a.at > alertsSeenAtOpen ? " new" : ""), onclick: () => { alertsOpen = false; location.hash = a.go; render() } },
    a.who ? av(a.who) : el("span", { class: "alert-dot" }, "!"),
    el("span", { class: "alert-body" }, el("span", {}, a.text), el("span", { class: "alert-time" }, a.key.startsWith("due:") ? "Today" : ago(a.at)))));
}
let alertsSeenAtOpen = 0;
function toggleAlerts() {
  alertsOpen = !alertsOpen;
  if (alertsOpen) { alertsSeenAtOpen = getAlertsSeen(); try { localStorage.setItem(seenAlertsKey(), String(Date.now())) } catch { } }
  render();
}
document.addEventListener("click", e => { if (alertsOpen && !e.target.closest("#alerts") && !e.target.closest("#bell")) { alertsOpen = false; render() } });

// Pop-up alerts on this device. They work while the site is open (a tab or the home-screen app).
let swReg = null;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then(r => { swReg = r }).catch(() => {});
async function enableDeviceAlerts() {
  try { const r = await Notification.requestPermission(); toast(r === "granted" ? "Alerts are on for this device" : "Alerts stay off. You can change this in your browser settings") } catch { toast("This browser can't show alerts") }
  render();
}
function notifyDevice(list) {
  if (!live) return;
  if (alertBaseline === null) { alertBaseline = new Set(list.map(a => a.key)); return }
  // Only pop up things that happened after the page was opened, not old ones that finished loading late.
  const fresh = list.filter(a => !alertBaseline.has(a.key) && a.at > pageOpenedAt && !a.key.startsWith("due:"));
  fresh.forEach(a => alertBaseline.add(a.key));
  if (!fresh.length || !("Notification" in window) || Notification.permission !== "granted") return;
  for (const a of fresh.slice(0, 3)) {
    const opts = { body: a.text, icon: "icon-192.png", badge: "icon-192.png", tag: a.key, data: { go: a.go } };
    if (swReg) swReg.showNotification("Pitch Room", opts).catch(() => {});
    else try { new Notification("Pitch Room", opts) } catch { }
  }
}

/* ----- me: personal home page ----- */

let meTab = "tasks";
function greeting() { const h = new Date().getHours(); return h < 5 ? "Up late" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening" }
function renderMe() {
  const box = $("#me"); box.replaceChildren();
  const prof = people[me] || {}, tops = topSkills(me);
  const fullName = (myProfile && myProfile.name) || prof.name || "";
  const all = myTasks(), open = all.filter(x => !x.t.done && !x.closed), today = todayStr();
  const overdue = open.filter(x => x.t.due && x.t.due < today).length;
  const weekAgo = Date.now() - 7 * 864e5;
  const doneWeek = all.filter(x => x.t.done && (x.t.doneAt || 0) > weekAgo).length;
  const building = activeProjects();

  box.append(el("section", { class: "profile" },
    el("img", { class: "av av-lg", src: (myProfile && myProfile.photo) || prof.photo || AV, alt: "", referrerpolicy: "no-referrer" }),
    el("div", { class: "profile-main" },
      el("div", { class: "hello" }, greeting() + ","),
      el("h1", {}, fullName.split(" ")[0] || "you"),
      el("div", { class: "row", style: "gap:6px;margin-top:8px" },
        tops.length ? tops.map(s => el("span", { class: "chip" }, SKILLS[s].name)) : el("button", { class: "linkbtn", onclick: () => { location.hash = "skills" } }, "Take the skills quiz \u2192")))),
    el("div", { class: "stats" },
      el("div", { class: "stat" }, el("b", {}, open.length), el("span", {}, "to do")),
      el("div", { class: "stat" + (overdue ? " late" : "") }, el("b", {}, overdue), el("span", {}, "overdue")),
      el("div", { class: "stat" }, el("b", {}, doneWeek), el("span", {}, "done this week"))));

  for (const p of building) {
    const left = tasksOf(p).filter(t => t.owner === me && !t.done).length;
    box.append(el("button", { class: "nowcard", onclick: () => { location.hash = "build-" + p.id } },
      el("span", { class: "now-label" }, "We're building"),
      el("span", { class: "now-title" }, p.title),
      el("span", { class: "now-sub" }, left ? `${left} of your tasks left \u2192` : "Open the project \u2192")));
  }

  if (privErr) box.append(el("div", { class: "notice" }, privErr === "rules"
    ? "Your personal tasks and notes can't load yet. Mohammed needs to publish the latest database rules in Firebase. This page will try again by itself."
    : "Your personal tasks and notes can't load right now. Check your connection. Trying again\u2026"));

  box.append(el("div", { class: "seg seg-wide", role: "group", "aria-label": "Show", style: "margin:18px 0 12px" },
    el("button", { "aria-pressed": String(meTab === "tasks"), onclick: () => { meTab = "tasks"; render() } }, "My tasks"),
    el("button", { "aria-pressed": String(meTab === "notes"), onclick: () => { meTab = "notes"; render() } }, "My notes")));
  const body = el("div");
  if (meTab === "notes") renderNotes(body); else renderMine(body);
  box.append(body);

  box.append(el("div", { class: "me-foot" },
    el("button", { class: "btn", onclick: () => { location.hash = "skills" } }, prof.skills ? "Skills & team" : "Skills quiz"),
    el("span", { class: "spacer" }),
    el("span", { class: "me-email" }, (myProfile && myProfile.email) || ""),
    el("button", { class: "btn", onclick: doSignOut }, "Sign out")));
}

/* ----- shared bits ----- */

function phaseBar(p, tasks) {
  const phases = getPhases(p); if (!phases.length) return null;
  return el("div", { class: "phasebar" }, phases.map((ph, n) => {
    const list = tasks.filter(t => t.phase === ph.id); const pr = progressOf(list);
    return el("span", { class: "ph" + (pr.total && pr.done === pr.total ? " complete" : "") }, `${n + 1} ${ph.name} ${pr.done}/${pr.total}`);
  }));
}

function fmtDate(d) { try { return new Date(d + "T00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" }) } catch { return d } }

function line(pr, unit) {
  const t = el("div", { class: "track", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": pr.pct, "aria-label": "Progress" }, el("div", { class: "fill", style: `width:${pr.pct}%` }));
  if (pr.total <= 30) for (let i = 1; i < pr.total; i++) t.append(el("span", { class: "tick", style: `left:calc(${i / pr.total * 100}% - 1px)` }));
  return el("div", { style: "display:grid;gap:6px" }, t, el("div", { class: "pmeta" }, el("span", {}, pr.total ? `${pr.done} of ${pr.total} ${unit} done` : `No ${unit} yet`), el("span", {}, pr.pct + "%")));
}

$("#me-btn").onclick = () => { location.hash = "me" };
$("#bell").onclick = e => { e.stopPropagation(); toggleAlerts() };
$("#brand").onclick = () => { location.hash = "me" };
if (loadCache()) show();

</script>
